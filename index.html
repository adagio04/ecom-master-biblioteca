<h1 id="nortes--a-rentabilidad-optimizar-para-el-profit-no-para-la-facturaci">A. Rentabilidad: optimizar para el profit, no para la facturación</h1>
<ul>
<li><strong>Break-even ROAS por debajo, siempre.</strong> Meta es una plataforma de pujas: cuanto más bajo tengas el break-even ROAS, más puedes pujar por cliente y más rápido escalas frente a la competencia. Para <strong>fashion, 1,4 es sano; 1,60 ya es demasiado</strong> (caso Yeray, a quien una comisión de 3 €/pedido le subió el break-even de 1,39 a 1,60).</li>
<li><strong>El margen manda sobre el volumen:</strong> <em>"vale más la pena hacer 100k de facturación con 30% de margen, que hacer 200k con 15%... cuando haces más números vienen más problemas."</em></li>
<li><strong>La reserva del 10% de Shopify Payments no es el problema real</strong> — si mantienes margen puedes correr perfectamente con ella; el problema es no tener el break-even optimizado.</li>
<li><strong>Comisiones que se comen el negocio:</strong> con 500 €/día de gasto, un 6% de comisión de agencia + 2% de cashback perdido = 8% = 40 €/día ≈ <strong>1.200 €/mes</strong>. Nortes recomienda cuenta personal o una agencia de fiar (menciona <strong>Easy Scale</strong>), nunca "ir a lo barato".</li>
<li><strong>Business Manager con historial aguanta más spend:</strong> abrió cuenta nueva y el primer día le dieron 3.000 $/día de límite sin "calentarla", gracias al historial de otras cuentas del mismo BM.</li>
</ul>
<h1 id="nortes--b-investigacion-de-mercado-y-calcar-al-lider">B. Investigación de mercado y "calcar" al líder</h1>
<p>Framework repetido a todo el grupo (Xavi, Adrián Bayo):</p>
<ul>
<li><strong>"Tú no eres tu ICP".</strong> Ninguna decisión de web/diseño se toma por gusto personal; todo se basa en datos de lo que ya funciona.</li>
<li><strong>Método:</strong> identificar al competidor con <strong>más ALCANCE publicitario</strong> de tu mercado (no el que más anuncios activos tiene), poner su web al lado de la tuya y <strong>calcarla</strong> — colores, tipografía, estructura de product page, colecciones vs individuales, storytelling, banners de descuento/cierre/aniversario. <em>"En Fashion puedes ir a 1-2K al día copiando y pegando la web del mejor de tu mercado."</em></li>
<li><strong>Criterio estricto de producto "validado"</strong> (por alcance de UN SOLO creativo, no sumando varios):</li>
<li>3–7 días activo → mínimo <strong>10k</strong> de alcance</li>
<li>7–14 días → <strong>50k</strong></li>
<li>14–21 días → <strong>100k</strong></li>
<li>21–30 días → <strong>250k</strong></li>
<li><strong>No fiarse solo del "mínimo 7 días activo":</strong> sus mejores winners en fashion muchas veces llevaban solo 4-5 días activos pero con mucho alcance.</li>
<li><strong>Lectura de métricas:</strong> CTR sano en fashion = <strong>3–4,5%</strong>. Si el CTR es bueno y CPC/CPM están controlados, el problema <strong>no es el creativo, es la web / conversion rate</strong>.</li>
<li><strong>Copiar un creativo ganador de otra tienda no rinde igual:</strong> cada píxel está optimizado según quién ya le ha comprado; no forzar el píxel hacia una categoría, dejarlo aprender del ICP real.</li>
</ul>
<h1 id="nortes--c-expansion-de-mercados-poco-explotados">C. Expansión de mercados (poco explotados)</h1>
<ul>
<li>A <strong>Xavi</strong> (estancado en España): primero calcar al líder español; luego expandir a Italia (similar a España), UK, Países Bajos (cuna del modelo), y mercados poco saturados: <strong>Nueva Zelanda, Noruega, Finlandia, Suecia</strong>. Llegó a facturar 3K/día en Japón.</li>
<li><strong>Noruega:</strong> conviene poner una factura de luz (hecha con ChatGPT) y dirección noruega para reducir rechazos de pago de bancos locales; <strong>nunca activar Klarna</strong> en esos mercados.</li>
<li>A <strong>Adrián Bayo</strong> (Francia que no escala de 50→100 €/día): calcar al líder francés y expandir la misma campaña a francófonos con menos competencia (<strong>Bélgica, Luxemburgo</strong>, probar Suiza).</li>
</ul>
<h1 id="nortes--d-estrategia-de-producto-colecciones-y-fashion-vs-branded">D. Estrategia de producto: colecciones y "fashion vs branded"</h1>
<ul>
<li><strong>Ir 100% a colecciones</strong> en vez de producto individual: mejor AOV y <strong>aguantan mucho mejor el escalado agresivo</strong>. Ha puesto una colección a +2.000 €/día (vs. 600-700 € máx. que suele ver en producto individual).</li>
<li><strong>Estructura para lanzar</strong> (dada a Adrián Miguel García): <strong>CBO único, 50 € de budget, 5 creativos de colección</strong>. Cortar si a 20 € no hay carritos / a 30 € no hay ventas. Con buen ROAS, dejar correr, acumular cashflow y, cuando Shopify Payments baje el plazo de pago de 7 a 3 días, escalar tests a 100 €.</li>
<li><strong>Fashion vs Branded:</strong> fashion es más fácil de arrancar (aunque dominarlo del todo es más difícil que escalar un mono-producto) pero de recorrido corto; <strong>branded</strong> es más difícil de arrancar pero construye activo vendible. Recomienda empezar en fashion y evolucionar a branded — lo que él hizo.</li>
</ul>
<h1 id="nortes--e-icp-avatar-y-angulos-pregunta-directa-de-adam">E. ICP / Avatar y ángulos — pregunta directa de ADAM ⭐</h1>
<p><strong>Adam preguntó</strong> (se presenta: fashion en Europa fuera de España, 1-2K€/día desde hace ~2 meses, subnicho bien identificado tipo pantalones —cortos, largos, vaqueros, chinos—): cómo <strong>exprimir al 100% un subnicho ya validado</strong> con colecciones segmentadas por categoría, y si se deja algo sobre la mesa.</p>
<p><strong>Respuesta de Nortes:</strong> el enfoque es correcto pero incompleto — el eje no es solo "qué producto" sino <strong>"a quién se lo vendes"</strong>. Cada producto del subnicho puede tener un ICP distinto aunque sea la misma categoría.</p>
<ul>
<li>Identificar qué producto rinde mejor y preguntarse <strong>quién lo compra</strong> (género, edad, aficiones, gustos) → definir el avatar (ej. "hombre 40-50 que le gusta vestir elegante").</li>
<li>Construir el catálogo <strong>alrededor de ese avatar</strong> (no solo vaqueros: también zapatos/complementos para el mismo perfil) → cross-sell natural, más AOV.</li>
<li><strong>Fuentes para investigar al avatar:</strong> grupos de Facebook (<em>"una mina de oro"</em>), Reddit, reseñas de Amazon de productos afines → extraer su <strong>vocabulario real</strong> para copy y product page.</li>
<li>Táctica: crear una <strong>"memoria" en Claude</strong> con la definición del ICP y todo lo recopilado de foros, para generar copy/creativos.</li>
<li><em>"Cuando tú estudias todo... y se lo pones en su cara como real, lo que realmente quiere escuchar para comprar, te va a comprar."</em></li>
</ul>
<p><strong>Reacción de Adam:</strong> confirma y añade que hay que mantener el mismo "idioma"/persona <strong>en todo el funnel</strong> (creativo → copy → checkout) sin fricción, "como darte la mano hasta la caja", usando el vocabulario textual del propio ICP.</p>
<h1 id="nortes--f-funnel-y-branding-puro-niveles-de-consciencia-segunda-preg">F. Funnel y branding puro — niveles de consciencia (segunda pregunta de ADAM) ⭐⭐</h1>
<p>El tramo más directamente de MARCA, surgido de una segunda pregunta de Adam sobre niveles de consciencia y creativos top-of-funnel:</p>
<ul>
<li><strong>Niveles de consciencia:</strong> el cliente tiene un problema (verse mejor) pero no conoce la marca ni sabe que la resuelve. El funnel debe <strong>primero dar a conocer la marca sin vender</strong> (<em>"a nadie le gusta que le vengan a vender"</em>).</li>
<li><strong>Táctica ToF (top of funnel):</strong> crear una <strong>página de Facebook de una "persona ficticia"</strong> (ej. "James", con foto de perfil y avatar acorde al ICP) y publicar un <strong>storytelling/copy muy largo en primera persona</strong>, como si esa persona contara cómo el producto le resolvió su problema y para qué ocasión lo usó. Cierre: <em>"postdata: todos me pedís el link, lo dejo aquí"</em>.</li>
<li>El objetivo de este creativo <strong>NO es el ROAS inmediato</strong> (suele salir ROAS ~1, frecuencia 1), sino <strong>reconocimiento</strong>: el cliente lee ~10 min de contenido, queda <strong>precalificado</strong>, y al día siguiente Meta lo <strong>retargetea</strong> con un anuncio agresivo de descuento → ahí llegan los ROAS altos (8-10) y frecuencia 2-4.</li>
<li>Estos ToF <strong>nunca se lanzan desde la página de la propia tienda</strong>, siempre desde una página externa/de tercero, con foto real (persona con el producto frente a un espejo) para que no parezca anuncio.</li>
<li><strong>No</strong> recomienda prelanders/advertoriales para fashion genérico, salvo producto con claim funcional fuerte (ej. camisa "antiarrugas").</li>
<li><em>"Ya no es como que te escucha de tu anuncio el primero, ya te ha escuchado de un testimonio de antes que hablaba bien de ti."</em></li>
<li><strong>Cómo leerlo en Meta Ads Manager:</strong> distinguir ToF (ROAS bajo, frecuencia 1, mucho spend, objetivo = conocimiento) de MoFu/BoFu (oferta/USP, frecuencia 2-4, ROAS 8-10, menos spend). No juzgar el ToF por su ROAS directo.</li>
</ul>
<h1 id="nortes--g-estructura-de-campanas-y-testing-creativo-a-volumen">G. Estructura de campañas y testing creativo a volumen</h1>
<ul>
<li><strong>⚠️ Preferencia clara por CBO sobre ABO</strong> (contrasta con el ABO→ACBO de Gonzalo): en ABO se quema más presupuesto testeando cada adset por separado y el aprendizaje no se acumula igual; en CBO los ángulos (ToF/MoFu/BoFu) conviven y "se compenetran muy bien".</li>
<li><strong>Práctica diaria:</strong> añadir <strong>un adset nuevo por concepto cada día</strong> dentro del mismo CBO (ej. 5 imágenes o 5 vídeos UGC del mismo concepto/copy); cortar el adset que no acumula spend ni métricas, sin tocar el resto.</li>
<li><strong>Win rate de creativos 5–8%</strong> es razonable incluso en marcas de millones/mes. Más creativos testeados por unidad de tiempo = más ganadores. <em>"Es un juego de volumen"</em> (con fundamento, no random).</li>
<li><strong>Imágenes &gt; vídeo para escalar:</strong> casi todo su spend es imagen/estática (de ~1.500 activas, ~10 son vídeo). Meta favorece el vídeo en el reparto de budget porque retiene más al usuario, <strong>pero eso no implica mejor rendimiento</strong>. Genera 150-300 creativos con IA de imagen (menciona <strong>Manus</strong>) en sesiones de 15-20 min.</li>
<li><strong>Escalado:</strong> si la campaña no aguanta doblar cada 24h, probar incrementos del <strong>20-25%</strong>.</li>
</ul>
<h1 id="nortes--h-backend-operaciones-escalar-el-backend-antes-que-el-fronte">H. Backend / operaciones — escalar el backend ANTES que el frontend</h1>
<p>Regla general: <em>"siempre es muy importante escalar el backend antes que el frontend"</em> — el negocio debe poder aguantar 20K/día aunque hoy esté en 2K/día. (Caso Adrian Ecom: mono-producto tipo skincare, ~80% de pedidos rechazados en aduana + 11.000 € retenidos en Shopify Payments.)</p>
<ul>
<li><strong>Agente de atención al cliente proactivo</strong> (vía <strong>OnlineJobs.ph</strong>, ~3-4 $/h) que contacte al cliente ANTES de que se queje si un pedido va a llegar tarde → reduce drásticamente quejas y reembolsos.</li>
<li><strong>Backend/supply chain manager</strong> que gestione proveedor + estado de pedidos (chequeo cada 48h) + comunicación con clientes.</li>
<li><strong>Aduanas → 3PL</strong> (almacén de terceros) en el país de destino, pidiendo un MOQ al proveedor: envíos más rápidos y sin problema aduanero.</li>
<li><strong>Cambiar de procesador de pago a partir de ~5.000 $/día o 100.000 $/mes</strong> (Shopify Payments puede congelar fondos sin motivo aun con 0 chargebacks — a Nortes le retuvieron fondos 120 días).</li>
<li>Mensaje de fondo: <strong>dejar de tratarlo como "tiendecita de dropshipping"</strong> y organizarlo como empresa por departamentos.</li>
</ul>
<h1 id="nortes--i-finanzas-tarjetas-llc-y-procesador-de-pagos-pregunta-de-ad">I. Finanzas: tarjetas, LLC y procesador de pagos — pregunta de ADAM ⭐</h1>
<p><strong>Adam preguntó:</strong> sus márgenes bajaron de ~20-30% a ~10% al migrar de cuentas españolas personales a estructura de Business Manager, y las comisiones de cambio de divisa (Shopify + Meta) le cuestan <strong>~50 $/día</strong>. ¿Qué hacer?</p>
<p><strong>Respuesta de Nortes:</strong></p>
<ul>
<li>Revisar el <strong>profit sheet</strong> (hoja de seguimiento financiero ya compartida en la comunidad) para detectar fugas.</li>
<li>Confirma que Adam usa <strong>Mercury</strong>; recomienda <strong>Slash</strong> — <em>"el mejor banco de todos los que he probado"</em>. Comisión de pago en euros ~1% en Slash vs ~3% en Mercury; <strong>2% de cashback si la ad account se paga en dólares</strong> (en euros no da cashback). Plan superior ~20-30 $/mes, "gratis" por lo que ahorra.</li>
<li>Poner la tienda en <strong>dólares</strong> si Shopify cobra mucho por cambio de divisa.</li>
<li><strong>WAP</strong> como procesador alternativo a partir de 5K$/día o 100K$/mes: pagos cada 2 días, soporte "10 de 10". Se ofrece a conectar a Adam con WAP cuando llegue a ese umbral.</li>
</ul>
<p><em>(Nota: esto </em><em>refuerza</em><em> lo que Gonzalo le dijo a Adam en la llamada de socios — migrar a Slash y usar WAP; dos fuentes independientes coinciden.)</em></p>
<h1 id="nortes--j-frases-citas-clave-de-nortes">J. Frases / citas clave de Nortes</h1>

<h3 id="nortes--aplicaciones-concretas-para-adam">Aplicaciones concretas para Adam</h3>
<ol>
<li><strong>Definir el ICP a nivel de sub-producto, no solo de subnicho:</strong> para cada categoría del subnicho, identificar el avatar específico y ampliar el catálogo con complementos para el mismo avatar (cross-sell, más AOV).</li>
<li><strong>Montar creatividades top-of-funnel de marca:</strong> página de Facebook de "persona ficticia" con storytelling largo en primera persona, sin venta directa, para precalificar antes del retargeting agresivo. <em>(La pieza de "branding" más accionable de la llamada; Adam ya lo señaló como acción a implementar.)</em></li>
<li><strong>Leer bien las capas del funnel:</strong> distinguir en el CBO adsets ToF (frec. 1, ROAS ~1, objetivo conocimiento) de MoFu/BoFu (oferta, frec. 2-4, ROAS alto); no juzgar el ToF por su ROAS directo.</li>
<li><strong>Investigar foros/grupos de FB/Reddit/reseñas de Amazon</strong> del ICP para extraer vocabulario real → copy (sistematizar en una "memoria" de ICP en Claude).</li>
<li><strong>Forzar el mix creativo hacia imágenes</strong> dentro de los adsets para facilitar el escalado.</li>
<li><strong>Frenar la fuga de márgenes por divisa:</strong> pasar de Mercury a <strong>Slash</strong> (comisión menor + 2% cashback pagando en USD) y considerar cobrar en dólares en Shopify. <em>(Coincide con Gonzalo.)</em></li>
<li><strong>Vigilar el umbral 5.000 $/día o 100.000 $/mes</strong> como disparador para migrar de Shopify Payments a <strong>WAP</strong> antes de sufrir una retención de fondos (paralelismo directo con Adrian Ecom).</li>
<li><strong>Revisar el profit sheet con regularidad</strong> para localizar dónde se pierde margen, en vez de asumir que la única palanca es meter más ad spend.</li>
</ol>

  const tagOf = t => nortes? new Set(['jul11']) : callsFromText(t);
  // pass 1: own tags per block / li
  for(const node of kids){
    if(node.tagName==='UL'||node.tagName==='OL'){
      node.dataset.list='1';
      node.querySelectorAll(':scope > li').forEach(li=>own.set(li, tagOf(li.textContent)));
    } else {
      own.set(node, tagOf(node.textContent));
    }
  }
  // pass 2: assign, inheriting the UNION of the section (bounded by H1/H2)
  let block=[], union=new Set();
  const flush=()=>{ for(const b of block){ const o=own.get(b)||new Set(); const c=o.size?o:union; b.dataset.calls=[...c].join(' '); } block=[]; union=new Set(); };
  for(const node of kids){
    if(node.tagName==='H1'||node.tagName==='H2'){ flush(); const c=own.get(node)||new Set(); node.dataset.calls=[...c].join(' '); c.forEach(x=>union.add(x)); continue; }
    if(node.tagName==='UL'||node.tagName==='OL'){
      node.querySelectorAll(':scope > li').forEach(li=>{ block.push(li); (own.get(li)||new Set()).forEach(x=>union.add(x)); });
    } else {
      block.push(node); (own.get(node)||new Set()).forEach(x=>union.add(x));
    }
  }
  flush();
}
function renderDoc(key){
  content.innerHTML=document.getElementById('tpl-'+key).innerHTML;
  content.querySelectorAll('a[href^="http"]').forEach(a=>{a.target='_blank';a.rel='noopener';});
  tagBlocks(content,key);
  currentDoc=key;
}

/* ---------- THEME (por tema) view ---------- */
function buildTOC(key){
  toc.innerHTML='';
  INDEX.filter(i=>i.doc===key).forEach(i=>{
    const a=document.createElement('a'); a.href='#'+i.id; a.textContent=i.title;
    a.className=i.level==='H1'?'h1':'h2';
    a.onclick=e=>{e.preventDefault();const t=document.getElementById(i.id);if(t)t.scrollIntoView({behavior:'smooth'});history.replaceState(null,'','#'+i.id);closeSidebar();};
    toc.appendChild(a);
  });
}
function selectDoc(key, anchor){
  mode='tema'; setModeUI();
  renderDoc(key);
  callCard.innerHTML='';
  content.querySelectorAll('[style]').forEach(e=>e.style.display='');
  const d=DOCS.find(x=>x.key===key); kicker.textContent=d.label;
  document.querySelectorAll('.doc-btn').forEach(b=>b.classList.toggle('active',b.dataset.key===key));
  buildTOC(key);
  window.scrollTo(0,0);
  if(anchor){const t=document.getElementById(key+'--'+anchor);if(t)setTimeout(()=>t.scrollIntoView(),40);}
  try{localStorage.setItem('bib-doc',key);}catch(e){}
}

/* ---------- CALL (por llamada) view ---------- */
function rank(t){return t==='H1'?1:t==='H2'?2:3;}
function filterByCall(id){
  const kids=[...content.children];
  for(const node of kids){
    if(/^H[123]$/.test(node.tagName)) continue;
    if(node.dataset.list){
      let any=false;
      node.querySelectorAll(':scope > li').forEach(li=>{
        const vis=(li.dataset.calls||'').split(' ').includes(id);
        li.style.display=vis?'':'none'; if(vis)any=true;
      });
      node.style.display=any?'':'none';
    }else{
      node.style.display=(node.dataset.calls||'').split(' ').includes(id)?'':'none';
    }
  }
  for(let i=0;i<kids.length;i++){
    const h=kids[i]; if(!/^H[123]$/.test(h.tagName)) continue;
    let vis=(h.dataset.calls||'').split(' ').includes(id);
    for(let j=i+1;j<kids.length && !vis;j++){
      const n=kids[j];
      if(/^H[123]$/.test(n.tagName) && rank(n.tagName)<=rank(h.tagName)) break;
      if(!/^H[123]$/.test(n.tagName) && n.style.display!=='none') vis=true;
    }
    h.style.display=vis?'':'none';
  }
}
function selectCall(id){
  const call=CALLS.find(c=>c.id===id); if(!call) return;
  mode='llamada'; currentCall=id; setModeUI();
  renderDoc(call.doc);
  const d=DOCS.find(x=>x.key===call.doc); kicker.textContent=d.label+' · por llamada';
  filterByCall(id);
  const isFathom=call.source==='Fathom';
  callCard.innerHTML=
    '<div class="call-card"><div><div class="cc-date">'+call.date+'</div>'+
    '<div class="cc-meta">'+call.title+' · '+call.dur+' <span class="badge">'+call.source+'</span></div></div>'+
    '<div class="cc-spacer"></div>'+
    '<a class="cc-btn" href="'+call.url+'" target="_blank" rel="noopener">'+(isFathom?'▶ Ver en Fathom':'📄 Abrir en Drive')+'</a></div>'+
    '<div class="cc-hint">Mostrando solo lo tratado en esta llamada. Cambia a <b>Por tema</b> para ver la doctrina completa agrupada.</div>';
  document.querySelectorAll('.call-item').forEach(b=>b.classList.toggle('active',b.dataset.id===id));
  window.scrollTo(0,0);
  try{localStorage.setItem('bib-call',id);}catch(e){}
}
function buildCallList(){
  callList.innerHTML='';
  let lastGroup=null;
  CALLS.forEach(c=>{
    if(c.group!==lastGroup){lastGroup=c.group;const g=document.createElement('div');g.className='call-group';g.textContent=c.group;callList.appendChild(g);}
    const it=document.createElement('div'); it.className='call-item'; it.dataset.id=c.id;
    it.innerHTML='<div class="ci-main"><div class="ci-date">'+c.date+'</div><div class="ci-sub">'+c.title+' · '+c.dur+'</div></div>'+
      '<a class="ci-link" href="'+c.url+'" target="_blank" rel="noopener" title="Abrir grabación">'+(c.source==='Fathom'?'▶':'📄')+'</a>';
    it.querySelector('.ci-main').onclick=()=>{selectCall(c.id);closeSidebar();};
    it.querySelector('.ci-link').onclick=e=>e.stopPropagation();
    callList.appendChild(it);
  });
}

/* ---------- mode toggle ---------- */
function setModeUI(){
  temaSide.hidden = mode!=='tema';
  callSide.hidden = mode!=='llamada';
  document.querySelectorAll('.mode-toggle button').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
}
document.querySelectorAll('.mode-toggle button').forEach(b=>{
  b.onclick=()=>{
    if(b.dataset.mode===mode) return;
    if(b.dataset.mode==='tema') selectDoc(currentDoc);
    else selectCall(currentCall||CALLS.find(c=>c.doc===currentDoc)?.id||CALLS[2].id);
  };
});

/* ---------- doc switcher (tema) ---------- */
DOCS.forEach(d=>{
  const b=document.createElement('button'); b.className='doc-btn'; b.dataset.key=d.key;
  b.innerHTML='<span class="em">'+d.emoji+'</span><span><span class="lb">'+d.label+'</span><span class="sb">'+d.sub+'</span></span>';
  b.onclick=()=>{selectDoc(d.key);closeSidebar();};
  docSwitch.appendChild(b);
});
buildCallList();

/* ---------- scroll spy (tema) ---------- */
let ticking=false;
window.addEventListener('scroll',()=>{
  if(mode!=='tema'||ticking)return; ticking=true;
  requestAnimationFrame(()=>{
    const hs=[...content.querySelectorAll('h1,h2')]; let cur=null;
    for(const h of hs){ if(h.offsetParent!==null && h.getBoundingClientRect().top<120) cur=h.id; else if(h.offsetParent!==null) break; }
    document.querySelectorAll('nav.toc a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+cur));
    ticking=false;
  });
});

/* ---------- search ---------- */
let hiIdx=-1, curResults=[];
function esc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function hl(text,words){let out=text;words.forEach(w=>{if(!w)return;out=out.replace(new RegExp('('+esc(w)+')','ig'),'<mark>$1</mark>');});return out;}
function runSearch(){
  const term=q.value.trim().toLowerCase();
  if(!term){results.classList.remove('open');results.innerHTML='';curResults=[];return;}
  const words=term.split(/\s+/);
  curResults=INDEX.filter(i=>{const t=i.title.toLowerCase();return words.every(w=>t.includes(w));}).slice(0,40);
  if(!curResults.length){results.innerHTML='<div class="empty">Sin coincidencias en títulos. Prueba otra palabra clave.</div>';results.classList.add('open');return;}
  results.innerHTML=curResults.map((r,idx)=>'<div class="r" data-i="'+idx+'"><div class="d">'+r.label+'</div><div class="t">'+hl(r.title,words)+'</div></div>').join('');
  results.classList.add('open'); hiIdx=-1;
  results.querySelectorAll('.r').forEach(r=>r.onclick=()=>go(curResults[+r.dataset.i]));
}
function go(r){results.classList.remove('open');q.value='';curResults=[];selectDoc(r.doc,r.id.split('--')[1]);}
q.addEventListener('input',runSearch);
q.addEventListener('keydown',e=>{
  if(!curResults.length)return;
  if(e.key==='ArrowDown'){e.preventDefault();hiIdx=Math.min(hiIdx+1,curResults.length-1);}
  else if(e.key==='ArrowUp'){e.preventDefault();hiIdx=Math.max(hiIdx-1,0);}
  else if(e.key==='Enter'){e.preventDefault();go(curResults[hiIdx<0?0:hiIdx]);return;}
  else return;
  results.querySelectorAll('.r').forEach((r,i)=>{r.classList.toggle('hi',i===hiIdx);if(i===hiIdx)r.scrollIntoView({block:'nearest'});});
});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))results.classList.remove('open');});

/* ---------- theme ---------- */
const themeBtn=el('#themeBtn');
function applyTheme(t){if(t)document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme');}
try{applyTheme(localStorage.getItem('bib-theme'));}catch(e){}
themeBtn.onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const dark=cur? cur==='dark' : matchMedia('(prefers-color-scheme:dark)').matches;
  const next=dark?'light':'dark'; applyTheme(next);
  try{localStorage.setItem('bib-theme',next);}catch(e){}
};

/* ---------- mobile sidebar ---------- */
function openSidebar(){sidebar.classList.add('open');scrim.classList.add('open');}
function closeSidebar(){sidebar.classList.remove('open');scrim.classList.remove('open');}
el('#menuBtn').onclick=()=>sidebar.classList.contains('open')?closeSidebar():openSidebar();
scrim.onclick=closeSidebar;
el('#updated').textContent='Última actualización: '+UPDATED+' · Generado desde el proyecto ECOM MASTER.';

/* ---------- init ---------- */
let start='mentoria';
try{const s=localStorage.getItem('bib-doc'); if(s&&DOCS.some(d=>d.key===s))start=s;}catch(e){}
if(location.hash){const k=location.hash.slice(1).split('--')[0]; if(DOCS.some(d=>d.key===k))start=k;}
selectDoc(start, location.hash?location.hash.slice(1).split('--')[1]:null);
</script>
