<template id="tpl-mentoria"><h1 id="mentoria--ecom-master-sintesis-de-llamadas-de-mentoria">ECOM MASTER — Síntesis de Llamadas de Mentoría</h1>
<p><strong>Mentor: Ger / Germán Aguilar ("Viventor", formación "Vision")</strong>
<em>Documento vivo que destila la metodología y los principios accionables de las llamadas de mentoría, para tenerlos como marco de decisión propio.</em></p>
<hr />
<h2 id="mentoria--como-usar-este-documento">Cómo usar este documento</h2>
<p>El conocimiento se organiza por <strong>temas</strong>, no por fecha, de modo que la doctrina se <strong>acumule y se refuerce</strong> con cada sesión en vez de dispersarse. Dentro de cada bloque, cada punto lleva entre paréntesis la llamada de la que sale — para poder volver al material original si hace falta el matiz completo, y para ver cómo evoluciona el criterio del mentor con el tiempo. La filosofía de Ger es deliberadamente <strong>anti-receta</strong>: no da fórmulas fijas, entrena tu criterio para leer el mercado. Lo que sigue son principios, no pasos rígidos — la validación final siempre es tu propia cuenta, tu mercado y tu tienda.</p>
<p><strong>Llamadas cubiertas:</strong> Mayo 2025 · 14 jun 2026 · <strong>23 jun 2026 (1-1 con Adam)</strong> · 5 ago · 9 ago · 16 ago · 19 ago · 26 ago 2026 (registro completo al final). <em>(La 1-1 del 23 jun ya está transcrita e incorporada — resuelto el pendiente anterior.)</em></p>
<blockquote>
<p><strong>Nota de evolución.</strong> Entre mayo 2025 y agosto 2026 el mentor ha ido cambiando algunos matices (sobre todo en escalado, agresividad de testeo y, muy marcadamente, en el <strong>cambio de proveedor</strong> de agosto 2026). Donde hay divergencia entre una llamada antigua y una reciente, se marca (🔄 <strong>Evolución</strong>) y <strong>manda lo más reciente</strong>, pero se conserva lo anterior porque el porqué sigue enseñando.</p>
<p><strong>Contexto temporal (ago 2026):</strong> todo el bloque de agosto está dominado por la <strong>preparación del Q4</strong> (arranca en septiembre) y por el <strong>anuncio del proveedor nuevo "MD"</strong>. Ger imparte estas llamadas desde Bali/Dubái.</p>
</blockquote>
<hr />
<h1 id="mentoria--a-testeo-y-conversion">A. Testeo y conversión</h1>
<h2 id="mentoria--1-leer-las-metricas-de-testeo-interes-venta">1. Leer las métricas de testeo (interés ≠ venta)</h2>
<p>El error mental a evitar: interpretar "buenas métricas sin venta" como un fracaso. Es justo lo contrario. Carritos, intentos de pago y buen CPM <strong>son data y son validación</strong> de que vas por buen camino, aunque no caiga la venta. <em>(Aug 16.)</em></p>
<p><strong>Caso de referencia (vestido de mujer):</strong> 11 añadidos al carrito, 4 intentos de pago, 0 ventas, buen CPM. Diagnóstico por descarte — precio descartado (bajar 5 € no desbloqueó), checkout descartado (otra campaña sí convertía), público normal: <strong>mujer es más impulsiva</strong> (muchos ATC) pero convierte peor; <strong>hombre</strong> genera menos interés pero <strong>convierte más fuerte</strong>. No es un fallo, es la naturaleza de cada público. <em>(Aug 16 · reforzado Aug 19.)</em></p>
<p><strong>No cortar por impulso — regla de los 2 días.</strong> Caso de ilya: campaña viernes-sábado con ROAS ~3 y CTR 4-6% que cortó al ver 0 ventas el domingo; al relanzar no vendió nada. Regla de Ger: <strong>2 días seguidos de beneficio → escalar; 2 días seguidos de pérdida → desescalar o cortar.</strong> Si no hay tendencia clara en 2 días, esperar un día más. <strong>No reanimar una campaña ya cortada: mejor lanzar otra nueva.</strong> <em>(Aug 9.)</em></p>
<p><strong>Estructura de funnel en el conjunto de anuncios:</strong> siempre debe haber un anuncio "top of funnel" (rompe el hielo con tráfico frío — es el que más gasta y más interacción tiene) y otro de retargeting/conversión (gasta menos, CTR proporcionalmente más alto). Etiquetar cada anuncio por tipo/ángulo para analizar patrones y no decidir por impulso. <em>(Aug 9.)</em></p>
<p><strong>Benchmarks de funnel:</strong> el patrón a vigilar es la caída <strong>Add to Cart → Checkout iniciado → Compra</strong>; sin referencias reales de conversión en cada paso no sabes si tu caída es normal. <em>(Mayo 2025.)</em></p>
<h2 id="mentoria--2-optimizacion-de-oferta-y-carrito">2. Optimización de oferta y carrito</h2>
<ul>
<li><strong>Auditar tu propia web desde el móvil</strong>, como un cliente. Simplificar, meter urgencia real pero no agresiva. <em>(Aug 16.)</em></li>
<li><strong>Palancas de conversión final:</strong> subir el % de descuento y testear; meter urgencia en el carrito (countdown, stock limitado). <em>(Mayo 2025.)</em></li>
<li><strong>Regla de las 48 h para evaluar cualquier cambio:</strong> día 1 puede estar sesgado; el día 2 es con el que firmas. <em>(Mayo 2025.)</em></li>
<li><strong>Italia — mucho carrito, poca conversión (patrón "muy normal"):</strong> mercado impulsivo, típico del nicho mujer. Soluciones: revisar la oferta completa del funnel, <strong>ajustar ligeramente el precio</strong> y reforzar urgencia con pop-ups. <em>(Aug 19.)</em></li>
<li><strong>Truco de pricing:</strong> en vez de terminar en ",90"/",95" (se percibe redondeo hacia arriba), usar terminaciones tipo <strong>",20"/",40"</strong> para que se perciba más cercano al número inferior. Bajar 2-3 € fue la diferencia entre "métricas bonitas" y tienda muy rentable. <em>(Aug 19.)</em></li>
</ul>
<h2 id="mentoria--3-cadencia-presupuesto-y-diversificacion-de-testeo">3. Cadencia, presupuesto y diversificación de testeo</h2>
<ul>
<li><strong>No ir "a saco":</strong> máximo agresivo <strong>3–4 testeos/día</strong>, repartidos entre días. Un solo día bueno o malo no es representativo. <em>(Aug 16.)</em></li>
<li><strong>Presupuesto de testeo: mínimo 50 € (mejor que 30 €)</strong> si el cashflow lo permite — se compra más data, el píxel optimiza antes. 30 € solo con cashflow muy ajustado o como testeo secundario de bajo riesgo. Regla de corte: <strong>sin venta en 24 h con 30 €, apagar</strong>. Para escalar, <strong>saltar directo al doble</strong> (30→60, 50→100), no incrementos pequeños. <em>(Aug 19.)</em></li>
<li><strong>Hora de lanzamiento: 3:00–5:00 AM hora del mercado.</strong> Casi nadie lanza a esa hora → puja barata, sin picos de coste, y tu campaña ya lleva tracción/aprendizaje cuando la competencia publica a las 7-8 AM. Si una cuenta gasta demasiado rápido por la mañana: crear cuenta nueva y/o retrasar el lanzamiento de 3 a 5 AM para estirar el gasto. (También absorbe el delay de 20-60 min de publicación.) <em>(Aug 19.)</em></li>
<li><strong>Por qué no meter mucho volumen de golpe:</strong> Shopify Payments <strong>retiene pagos</strong> si escalas facturación muy rápido → te ahogas de cash flow antes de cobrar. Todo necesita periodo de asentamiento. <em>(Aug 16.)</em></li>
<li><strong>Diversificar al principio (50/50):</strong> colección / producto individual; y dentro, hombre / mujer; y foto / vídeo. "No te quites las balas." Luego ennichar hacia lo que mejor funcione. <em>(Aug 16 · Aug 5.)</em></li>
<li><strong>Comparar campañas día a día:</strong> si todas caen → día flojo; si una se mantiene y otra baja → ahí decides dónde meter fuego. <em>(Aug 16.)</em></li>
</ul>
<blockquote>
<p>🔄 <strong>Evolución (agresividad).</strong> Mayo 2025 empujaba más volumen y velocidad; ago 2026 lo matiza: volumen <strong>sí, pero repartido y sostenible</strong> por el tema de Shopify Payments y cash flow.</p>
</blockquote>
<h2 id="mentoria--4-segmentacion">4. Segmentación</h2>
<ul>
<li><strong>Por defecto: segmentación ABIERTA.</strong> "Meta sabe mejor que yo a quién entregárselo." <em>(Aug 16.)</em></li>
<li><strong>Cerrada</strong> puede dar CPCs más bajos, pero hoy no es determinante. En la estrategia de 30 € la puso opcional (vas al grano por nicho para ver sí/no rápido). <em>(Aug 16.)</em></li>
<li><strong>Regla de oro:</strong> <em>si te va bien, no toques lo que funciona.</em> <em>(Aug 16.)</em></li>
</ul>
<h2 id="mentoria--5-bundles-y-promociones">5. Bundles y promociones</h2>
<ul>
<li><strong>No testear bundles/promociones (ej. pantalón + cinturón) antes de validar el producto individual</strong> — "muy difícilmente va a funcionar" de primeras. Tampoco páginas tipo "one product store" con múltiples ítems en moda (mala UX móvil). <em>(Aug 19.)</em></li>
<li><strong>Campañas separadas por variante/color</strong>, cada una optimizándose a su público (analogía con los colores del iPhone). Más campañas = más fácil facturar con el tiempo. <em>(Aug 19.)</em></li>
<li>Una vez validado el producto, <strong>sí</strong> se puede testear una oferta/bundle en campaña aparte sin quemar el testeo en frío. <em>(Aug 19.)</em></li>
</ul>
<hr />
<h1 id="mentoria--b-estructura-de-campanas-escalado-y-pixel">B. Estructura de campañas, escalado y píxel</h1>
<h2 id="mentoria--6-colecciones-el-nucleo-del-escalado-horizontal-framework-de">6. Colecciones: el núcleo del escalado horizontal (framework de la 1-1)</h2>
<p><strong>Por qué colecciones &gt; producto individual:</strong> las colecciones <strong>multiplican el AOV</strong> con el mismo gasto publicitario (el cliente compra 2-3 uds. en vez de 1), con el <strong>mismo CPA</strong> → más ingreso por pedido → menor coste de envío proporcional → mejor negociación con proveedor → más margen neto sin subir presupuesto. Cita: <em>"En Meta ya no es lo que ganas, es lo que no pierdes, porque con la misma publicidad facturas más."</em> Con producto individual Adam sacaba hasta 15k € con un producto; con colección, la facturación se multiplica <strong>x3 a x5</strong> (crecimiento exponencial, no lineal). <em>(Jun 23 · 1-1.)</em></p>
<p><strong>Cómo construir las colecciones:</strong></p>
<ul>
<li>Identificar los <strong>bestsellers reales</strong> (los que más han convertido a VENTA, no solo CTR/CPC/ATC) de los últimos 15-30 testeos → Excel ordenado de mayor a menor venta ("analízate como a un competidor"). <em>(Jun 23 · 1-1.)</em></li>
<li>Segmentar por <strong>atributos compartidos</strong> (punta redonda, punta de pico, slingback, color, variantes del ganador). Con <strong>8-15 productos muy focalizados</strong> basta; meter los que no vendieron como "relleno" al final. <em>(Jun 23 · 1-1.)</em></li>
<li><strong>Funnel psicológico inverso</strong> (estilo Zalando/Bershka): mostrar primero el ganador y, si el usuario hace scroll sin interactuar, ir abriendo el abanico hacia variantes cada vez más distintas para romper la fricción y capturar indecisos. Sin miedo a 4-5 secciones largas en la colección. <em>(Jun 23 · 1-1.)</em></li>
</ul>
<p><strong>Presupuesto y reglas de decisión por colección:</strong></p>
<ul>
<li><strong>Colecciones nuevas: lanzar a 150 €/día</strong> (son creativos ya validados, hay que cuidarlas desde el arranque). <em>(Jun 23 · 1-1.)</em></li>
<li><strong>Ser permisivo con CPC alto al principio</strong> (1 € y pico en los primeros 20-30 € es normal, suele bajar). Lo que importa es el <strong>ATC</strong>, no el CPC. <em>(Jun 23 · 1-1.)</em></li>
<li><strong>Puntos de decisión por gasto acumulado:</strong> 20-30 € con 1-3 ATC → seguir; hasta 50 € con ATC pero sin venta → seguir; <strong>a los 50 € es el punto de cortar o no</strong> (si buen CTR y CPC bajando, dejar correr aunque no sea rentable el día 1). Con 150 €/día, día 1 = 1 venta, día 2 = 2-4, subiendo con la optimización. <em>(Jun 23 · 1-1.)</em></li>
</ul>
<h2 id="mentoria--7-de-coleccion-a-cbo-individual-el-truco-infalible">7. De colección a CBO individual (el truco "infalible")</h2>
<ul>
<li>Los productos que <strong>más venden dentro de una colección</strong> → <strong>sacarlos a CBOs individuales</strong> ("subramas"), sin esperar. Y cada <strong>variante de color de un ganador</strong> debe testearse como <strong>producto independiente</strong>, no solo como creativo. Cita: <em>"gente ha pasado de 3.000 a 6.000 €/día así de fácil"</em> solo con esto; una colección de un producto ganador le facturó <strong>8 veces más</strong> que el producto suelto. Ger repite "que quede grabado". <em>(Mayo 2025 · reafirmado Aug 5.)</em></li>
<li>Palanca principal de crecimiento horizontal; se pueden llevar varias colecciones + varios CBOs individuales a la vez si el píxel está entrenado. <em>(Mayo 2025.)</em></li>
<li><strong>"En moda, nuestros creativos son los productos":</strong> cada color/variante ya funciona como creativo nuevo → no hace falta renovar creativos tan agresivamente como en "branded/one product". <em>(Aug 5.)</em></li>
</ul>
<h2 id="mentoria--8-escalado">8. Escalado</h2>
<p><strong>Reglas base (mayo 2025):</strong> margen 20–30% → subir 20%; campaña fatigada → x3/x5 (aggressive burn); <strong>ROAS ≥ 2.5</strong> → escalar cada 24 h; ventana de escalado <strong>8–12 AM</strong>.</p>
<p><strong>Refinamiento (agosto 2026):</strong></p>
<ul>
<li><strong>Saltos grandes y decisivos, no pasos pequeños:</strong> de 30 € → duplicar mínimo (60 €) o 100 €. Más presupuesto = más aprendizaje para Meta, menos fluctuación. Los ajustes pequeños y frecuentes desestabilizan el algoritmo. <em>(Aug 16 · Aug 19.)</em></li>
<li><strong>El dinero de verdad está en el escalado:</strong> con el mismo ROAS, más presupuesto = mucho más beneficio absoluto. <strong>Condición: verificar que al escalar aguanta el ROAS</strong> — validar rentabilidad tanto en 50 € como en 1.000 € de gasto. Si no aguanta, dejar que se optimice. <em>(Aug 16 · reforzado Aug 26.)</em></li>
<li><strong>No hay presupuesto "mágico":</strong> si por cash flow no llegas al salto ideal, escala algo menos, pero <strong>sostenlo hasta cobrar por Shopify</strong>. <em>(Aug 16.)</em></li>
<li><strong>Regla de creativos al escalar (Manuel):</strong> no hay regla fija; dejar que los creativos se optimicen <strong>2-4 escalados</strong> antes de renovar. Presupuesto ~<strong>10-15 €/creativo</strong> (colección 100 € → 10 creativos; estirable a 15-20 €). Ni muy pronto (ahogas la campaña) ni muy tarde (fatiga). Los creativos nuevos van con <strong>delay</strong> de un par de días. <strong>Frecuencia:</strong> 2 = retargeting sano; <strong>&gt;2,5–3 → cuidado, se quema el público.</strong> <em>(Aug 5.)</em></li>
</ul>
<blockquote>
<p>🔄 <strong>Evolución.</strong> El marco de mayo (subir 20% con margen, cadencia 24-48 h) sigue válido como <strong>ajuste fino de campañas asentadas</strong>. Para <strong>arrancar el escalado de una winner joven</strong>, hoy Ger prefiere el <strong>salto grande de golpe</strong> (duplicar o más) para reducir reaprendizajes.</p>
</blockquote>
<h2 id="mentoria--9-pixel-y-optimizacion">9. Píxel y optimización</h2>
<ul>
<li><strong>50 conversiones</strong> para tener el píxel optimizado (por píxel, no por campaña); Ger ya nota rendimiento claro con <strong>20-30 ventas</strong> — lo clave es un <strong>patrón repetido</strong>, no 5 compras sueltas. <em>(Mayo 2025 · Aug 26.)</em></li>
<li><strong>Optimizar siempre a "conversión a venta"</strong> (compras), nunca a "valor de conversión" ni a "add to cart" — con funnel a landing/colección Meta no interpreta bien otros objetivos. <em>"Con las atribuciones de venta no se juega."</em> <em>(Jun 23 · 1-1.)</em></li>
<li><strong>Píxel por temporada:</strong> no mezclar nichos muy distintos (bañadores de verano vs abrigos de invierno). <strong>Píxel nuevo a partir de sept-oct</strong> para otoño-invierno; los píxeles no se borran, se pueden tener muchos. <em>(Aug 9 · Aug 26.)</em></li>
<li><strong>Al relanzar un winner de otra temporada/mercado, usar el PÍXEL NUEVO</strong>, no el antiguo — el producto es lo que gana, el píxel solo "lee" un momento concreto. Así, si falla, sabes que es aprendizaje/mercado, no dudas del producto. <em>(Aug 26.)</em></li>
<li><strong>Evitar "parones"</strong> (pausar, tocar contraseñas, reactivar tras mucho tiempo): desentrenan el píxel (caso Esteban: metió la contraseña de la tienda a mitad de día, rompió el checkout, gastó sin convertir → confundió al píxel). <em>(Aug 9.)</em></li>
<li><strong>Regla:</strong> si tienes buenas métricas, no cambies de píxel; si son muy malas y sostenidas, no hay problema en crear uno limpio. <em>(Aug 26.)</em></li>
<li><strong>WeTracker Connect:</strong> app que permite <strong>desconectar y reconectar el mismo píxel a otra tienda de Shopify</strong> sin perder los datos (alojados en WeTracker, no en el código de la tienda). Antes imposible con Facebook. <em>(Aug 26.)</em></li>
</ul>
<h2 id="mentoria--10-estructura-anti-baneo-de-cuentas-de-meta-con-diagrama-en-">10. Estructura anti-baneo de cuentas de Meta (con diagrama en pantalla)</h2>
<p>Motivado por el caso de Dani (2 cuentas baneadas) y por una <strong>pregunta directa de Adam</strong>.</p>
<p><strong>Jerarquía:</strong> Cuenta personal de Facebook → Portfolio (Business Manager) → Cuentas publicitarias → Píxeles / Fan Pages (estos cuelgan del <em>portfolio</em>, no de la cuenta publicitaria). <em>(Aug 5.)</em></p>
<ul>
<li>Baneo de <strong>cuenta publicitaria</strong> → pierdes solo esa; píxel y fanpage sobreviven y se reasignan a otra cuenta del mismo portfolio.</li>
<li>Baneo de la <strong>cuenta personal de Facebook</strong> → pierdes TODO lo que cuelga. Es lo más importante a proteger.</li>
<li>El <strong>portfolio no se banea</strong> solo.</li>
<li><strong>Entre portfolios NO se comparte nada</strong> (píxel ni campaña) — empiezas de cero. <strong>Dentro del mismo portfolio SÍ</strong> se comparte el píxel entre cuentas publicitarias (respuesta directa de Ger a la pregunta de seguimiento de Adam).</li>
<li><strong>"Splitting risk":</strong> con 5+ campañas rentables, empezar a testear en una segunda cuenta/BM con el mismo píxel para repartir la facturación 50/50; si te tiran una, pierdes el 50% y no el 100%. Con 3 cuentas, el riesgo por cuenta baja a ~33%. <em>(Aug 5.)</em></li>
<li><strong>Buenas prácticas:</strong> verificar el BM con la LLC; un perfil de Chrome distinto por cuenta de Facebook; 2FA distinto por cuenta; extensión <strong>Get2GetCookie</strong> (enmascara IP, evita alertas de "inicio de sesión sospechoso" sin proxy — aportada por Adam en el chat). No se pueden cambiar divisa ni zona horaria de una cuenta tras crearla; ni borrar cuentas publicitarias (se buguean). <em>(Aug 5.)</em></li>
<li><strong>Desbloqueo de límite de gasto en cuentas nuevas:</strong> Facebook desbloquea rápido si no vas a saco (1 testeo/día); campañas de interacción diarias, Instagram conectado, 2FA + LLC + más admins verificados aceleran. Más crítico que Facebook: <strong>tener los pagos de Shopify desbloqueados.</strong> <em>(Aug 9.)</em></li>
<li><strong>Media buyer para el desfase horario (pregunta de Adam sobre Australia):</strong> contratar un <strong>media buyer filipino vía OnlineJobs.ph</strong> (~2-3 €/h) con acceso <strong>limitado solo a activar/desactivar campañas y ajustar presupuesto</strong> (nunca finanzas ni portfolio completo). Ger probó Claude + MCP de Meta hace mes y medio y lo vio "muy verde". La seguridad de la cuenta no se rompe por viajar, sino por <strong>cambios erráticos simultáneos</strong> (contraseña + 2FA + teléfono + saltos de IP). <em>(Aug 19.)</em></li>
</ul>
<h2 id="mentoria--11-dias-de-la-semana-y-ventana-horaria">11. Días de la semana y ventana horaria</h2>
<ul>
<li><strong>Lunes (Europa):</strong> tiende a bajar (no es regla fija, testéalo). <strong>Martes:</strong> escalar sin miedo. <em>(Aug 16.)</em></li>
<li><strong>Escalar el lunes = alto riesgo/alta recompensa:</strong> aunque el lunes pierdas algo, martes/miércoles ya vas por delante con el presupuesto escalado. Alternativa conservadora: dejar el lunes de asentamiento y meter ese dinero en testeo. <em>(Aug 16.)</em></li>
<li><strong>La tracción entre semana se refleja en el fin de semana</strong> (los findes pegan el bombazo). Clave para Q4. <em>(Aug 16.)</em></li>
<li><strong>Ventana intradía para escalar: 8–12 AM.</strong> Para <strong>lanzar testeos</strong>: 3–5 AM (ver §3). <em>(Mayo 2025 · Aug 19.)</em></li>
</ul>
<h2 id="mentoria--12-flow-post-compra-contracargos-y-metodos-de-pago">12. Flow post-compra, contracargos y métodos de pago</h2>
<ul>
<li><strong>Email post-compra a las ~72 h</strong> (Klaviyo): "tu pedido está en camino, contáctanos si hay algún problema". Los contracargos nacen del miedo del cliente a haber sido estafado → prevenir antes de que aparezca el problema es la única solución real. <em>(Mayo 2025: ajustar de 7 a 3-5 días · Aug 19: 72 h.)</em></li>
<li><strong>Superar el 1% de contracargos</strong> → Shopify Payments puede <strong>desactivar la pasarela o aplicar un <em>hold</em> sobre TODOS los fondos</strong>, no solo devolver el pedido en disputa. Los chargebacks dejan huella; las devoluciones normales no → <strong>hacer siempre las devoluciones</strong>. <em>(Aug 19 · Aug 9.)</em></li>
<li><strong>⚠️ Nunca activar PayPal.</strong> Sube la facturación un 20-30% pero pone en riesgo el 70-80% restante (arriesga toda la cuenta Shopify Payments); el checkout impulsivo atrae compradores menos comprometidos y más reclamadores. Con <strong>tarjeta</strong> el comprador es más serio y paga tickets más altos. <strong>Evitar también Klarna.</strong> Al quitar PayPal el píxel tarda 1-2 días en reajustarse; no alarmarse. <em>(Aug 19.)</em></li>
<li><strong>Mercados que van bien solo con tarjeta:</strong> España, EE.UU., Australia, UK. <strong>Desaconsejados por métodos de pago complejos:</strong> Polonia, Países Bajos (Bancontact/iDEAL), Alemania (Klarna integrado). <em>(Aug 19.)</em></li>
</ul>
<h2 id="mentoria--13-volumen-validado-de-4-a-5-y-6-cifras">13. Volumen validado: de 4 a 5 (y 6) cifras</h2>
<ul>
<li>La fórmula de crecimiento es <strong>VOLUMEN</strong>: más colecciones en paralelo, más CBOs individuales, más creativos/ángulos/ofertas. Pero <strong>volumen VALIDADO</strong>, no al azar: coger los ángulos/creativos ganadores ya probados y generar variantes (mismo ángulo, distinto formato: música, UGC, collage). <em>(Mayo 2025 · Jun 23 · 1-1.)</em></li>
<li>Framework aproximado (depende de cashflow/mercado): 1 producto individual con buenos creativos → 1.000-3.000 €/día; colecciones + creativos ganadores → 5.000-10.000 €/día; 10 creativos ganadores por colección → 20.000-50.000 €/día. <em>"Es volumen, volumen, volumen... hay millones de personas en tu mercado."</em> <em>(Jun 23 · 1-1.)</em></li>
</ul>
<hr />
<h1 id="mentoria--c-busqueda-de-producto-proveedor-y-competencia">C. Búsqueda de producto, proveedor y competencia</h1>
<h2 id="mentoria--14-cambio-de-proveedor-el-nuevo-md-mutual-dropshipping">14. 🔄 Cambio de proveedor: el nuevo "MD" (Mutual Dropshipping)</h2>
<p><strong>El gran movimiento de agosto 2026.</strong> Ger anuncia la transición del proveedor histórico (saturado este verano: envíos de 8-10 días → <strong>20-25 días reales</strong>, disparando devoluciones/reembolsos) a un proveedor nuevo, privado, referido boca a boca, tras 2-3 meses validándolo. <em>(Aug 5 · Aug 9.)</em></p>
<ul>
<li><strong>Por qué:</strong> <em>"me parece como el Bitcoin en el 2009... seguro que va a triunfar."</em> Controles de calidad superiores (menos clientes, más dedicación; comparan foto pasada vs foto real de fábrica), envíos <strong>7-12 días</strong> con estimación y opción express, y <strong>plataforma propia</strong> (no solo WhatsApp): tracking, <strong>monedero/saldo</strong> (sin comisiones de transferencia internacional ni trazabilidad perdida), sourcing por foto (matching exacto en 1-2 días, con más colores/tallas de los que llevabas), custom packaging, muestras. <em>(Aug 5.)</em></li>
<li><strong>Catálogo de productos winner integrado y filtrable por nicho</strong> (woman fashion → vestidos, tops, conjuntos, bodas/eventos): productos que ellos <strong>saben que se venden</strong>, no visibles en la Ad Library → <strong>método de búsqueda de winner nuevo, rápido y gratis</strong> ("como Winning Hunter pero gratis"). Registrarse YA aunque no conectes la tienda, solo para acceder al catálogo. <em>(Aug 5.)</em></li>
<li><strong>Resultado de referencia:</strong> un colega (Ali) facturó ~200.000 USD el mes pasado con ~80.000 USD de profit neto (34-40% inicial → ~20-30% al escalar); otra tienda "normalita" 15.000 €/mes en recurrencia. <em>(Aug 5 · Aug 9.)</em></li>
<li><strong>Cómo adoptarlo:</strong> si empiezas ahora, pruébalo; si tienes tienda con el otro proveedor, <strong>no mezcles — pruébalo en una tienda nueva</strong>. Construir confianza pagando rápido los primeros pedidos (el proveedor aún no te conoce; empieza pedido a pedido y se negocia flexibilidad con volumen). <em>(Aug 5.)</em></li>
<li><strong>Impacto en escalado:</strong> Ger no pudo escalar una tienda de 10.000 €/día a 1M€/mes por los tiempos de envío del proveedor antiguo. Un buen proveedor es <strong>indispensable para el Q4</strong>. <em>(Aug 9.)</em></li>
<li>Existe un proveedor "premium" (Day One) que exige ~3.000 €/día de facturación → descartado para la mayoría por poco accesible. <em>(Aug 5 · Aug 9.)</em></li>
<li><strong>Acción de Ger:</strong> compartir link de registro por Discord y hacer un vídeo de onboarding para la formación (pendiente). <em>(Aug 5.)</em></li>
</ul>
<h2 id="mentoria--15-validacion-de-proveedor-y-precios">15. Validación de proveedor y precios</h2>
<ul>
<li><strong>Ver el precio real en Aliexpress:</strong> al importar el producto, bajar a <strong>"Find Suppliers"</strong> → listado en Aliexpress. Aliexpress mete margen "rata" de 10-20 € (dirigido al comprador chino); el proveedor real suele estar más barato. <em>(Aug 26.)</em></li>
<li><strong>Rangos orientativos:</strong> prenda decente ~20 USD; abrigo/piel ~30-40 USD. <strong>Desconfiar de moda por debajo de 10 USD.</strong> Envíos ~8-12 USD (hasta 14). <em>(Aug 26.)</em></li>
<li><strong>Un proveedor barato es motivo de DESCONFIANZA</strong>, no de alegría — mejor pagar algo más y asegurar calidad/envío que arriesgar devoluciones/contracargos que se comen el profit. Enfocar el margen en el <strong>precio de venta</strong>, no en pelear el coste. <em>(Aug 26.)</em></li>
<li><strong>Tabla de tallas del proveedor REAL</strong> (no la copiada del competidor) — errores de tallaje generan reclamaciones directas. App <strong>ScaleChart</strong> (en beta): automatiza que el proveedor suba tabla de tallas real + fotos/vídeos. <em>(Aug 26.)</em></li>
<li><strong>Ejemplo de margen:</strong> coste ~10-11 € → PVP 30-35 € → margen ~30 €, conservador. <em>(Aug 16.)</em></li>
</ul>
<h2 id="mentoria--16-winning-hunter-ingenieria-inversa">16. Winning Hunter (ingeniería inversa)</h2>
<p><strong>No hay configuración mágica de filtros; se suman por categorías.</strong> Setup de Ger para moda: <strong>Technologies = Shopify</strong> (filtra dropshipping); <strong>Themes de moda: Impulse, Horizon</strong> (Prime/Rhyme NO es moda); <strong>Country</strong> para acotar mercado; <strong>Collection Page</strong> como tipo de página (las colecciones escalan más rápido). <em>(Aug 16.)</em></p>
<ul>
<li><strong>Ignorar impresiones/alcance</strong>: gasto bajo en Meta puede ser testeo, no es negativo. <strong>Ir al grano con el Score</strong> (6.500, 15.000 = facturan a lo grande). <em>(Aug 16.)</em></li>
<li><strong>Ingeniería inversa (lo más valioso):</strong> de una tienda winner → su biblioteca de anuncios → ver qué le mete más pasta. "Tirar del hilo." <em>(Aug 16.)</em></li>
<li><strong>Mito del "calentar cuenta" con 1-2 $/día:</strong> no existe; suele ser creativos por debajo dentro de una CBO winner testeando. <em>(Aug 16.)</em></li>
</ul>
<h2 id="mentoria--17-productos-winner-variantes-y-estacionalidad">17. Productos winner, variantes y estacionalidad</h2>
<ul>
<li><strong>"El producto ganador no existe": lo que existe es tu conocimiento y tu lógica.</strong> Las variantes de un winner suelen ser winners (largo/corto, otros colores). <em>(Aug 16.)</em></li>
<li><strong>Relanzar winners de temporadas pasadas:</strong> nadie se acuerda de testearlos → baja competencia (ej. pantalones cortos de hombre le facturaron ~30.000 € el año pasado por agosto). <em>(Aug 16.)</em></li>
<li><strong>Ser visionario / guardar tiendas de temporada:</strong> guardar tiendas de 10-30k con enfoque de verano para cuando pivoten a Q4; vigilar qué productos nuevos mete el catálogo del proveedor MD como señal de tendencia. <em>(Aug 5.)</em></li>
<li><strong>Vigilar el clima con ≥1 semana de antelación</strong> antes de lanzar producto de temporada; mientras, tirar productos "ambiguos" (manga corta, polos, pantalones que sirven de agosto a octubre) para no perder momentum ni forzar frío antes de tiempo. <em>(Aug 26.)</em></li>
</ul>
<h2 id="mentoria--18-inteligencia-competitiva-competidores-que-se-ocultan">18. Inteligencia competitiva (competidores que se ocultan)</h2>
<ul>
<li><strong>Táctica de los que esconden su tienda:</strong> nombre de Fan Page distinto al de la tienda, y nombre en Ad Library distinto al dominio. <strong>Contra-táctica:</strong> buscar por patrones de copy y de creativo, no solo por marca. <em>(Mayo 2025.)</em></li>
<li><strong>Filtrar Ad Library por "anuncio inactivo"</strong> para medir demanda histórica (poca competencia puede ser oportunidad o falta de demanda). <em>(Aug 9.)</em></li>
</ul>
<hr />
<h1 id="mentoria--d-mercados-expansion-y-estructura-q4">D. Mercados, expansión y estructura Q4</h1>
<h2 id="mentoria--19-mapa-de-mercados">19. Mapa de mercados</h2>
<ul>
<li><strong>Italia y España:</strong> mercados base; Italia muy impulsivo en verano (mucho carrito, cuesta convertir — ver §2). Bien trabajado, Italia puede facturar 1M€/mes. <em>(Jun 14 · Aug 19.)</em></li>
<li><strong>Grecia y Rumanía:</strong> buen momentum reciente, pocos competidores, <strong>checkout simple</strong> (sin métodos complejos tipo Bancontact/iDEAL). <em>(Jun 14 · Aug 9.)</em></li>
<li><strong>Polonia:</strong> buen mercado, pero cuidado con métodos de pago. <em>(Jun 14 · Aug 19.)</em></li>
<li><strong>Francia:</strong> más conservador, cuesta tracción → necesita más enfoque en copys. <em>(Jun 14.)</em></li>
<li><strong>Casos sorpresa:</strong> Israel (alumno a 5.000 €/día), Japón (envíos rápidos por proximidad a fábricas chinas). <em>(Aug 9.)</em></li>
<li><strong>No temer salir de Europa:</strong> EE.UU., Australia, UK — todos válidos con buen análisis de competencia. <em>(Aug 16.)</em></li>
</ul>
<h2 id="mentoria--20-entrada-a-eeuu-y-aov-por-mercado">20. Entrada a EE.UU. y AOV por mercado</h2>
<ul>
<li><strong>EE.UU. recomendado "al 100%" a quien tenga cashflow.</strong> Cashflow para entrar: <strong>3-5K €, idealmente cerca de 5K</strong>. Entrar YA, antes de Q4, da ventaja de menor saturación. No meter todo de golpe: tramos de 1.000 € (test 200→400 € → ver tracción). Para principiantes sin experiencia, mejor un solo mercado sencillo primero. <em>(Aug 5 · Aug 9 · Aug 19.)</em></li>
<li><strong>AOV en EE.UU./Australia:</strong> la mayoría de competidores venden <strong>&gt;80 USD</strong>; hay low-ticket 49-70 USD para otro avatar. Apuntar a público con poder adquisitivo, precio alto. AOV medio de Ger ~<strong>70 €/$</strong>. <em>(Aug 26.)</em></li>
<li><strong>CPC en EE.UU.:</strong> algo más alto que en Europa por competencia (ES &lt;1 € bueno; US ~1-1,3 € normal), no por peor producto. No obsesionarse con el CPM (30-40 en primeros testeos es normal). <em>"El CPC no me da de comer, la rentabilidad de la campaña sí"</em> (cita de Adam validada por Ger). <em>(Aug 9 · Aug 19.)</em></li>
<li><strong>Calcular el CPC de competidores</strong> por ingeniería inversa como baremo. Baremo general: CPC &gt;1-1,50 € tiende a ser alto en testeo (en Q4 sube). <em>(Aug 16 · Aug 19.)</em></li>
</ul>
<h2 id="mentoria--21-reutilizacion-de-cuentas-y-zona-horaria">21. Reutilización de cuentas y zona horaria</h2>
<ul>
<li><strong>Reutilizar cuenta publicitaria:</strong> una cuenta ya <strong>calentada</strong> de un país UE (ej. Italia) sirve para abrir tienda en cualquier otro país UE (misma timezone Europa, da igual euro o dólar con LLC). Para <strong>EE.UU.</strong>, cuenta nueva (el mercado cambia demasiado). <em>(Aug 26.)</em></li>
<li><strong>Zona horaria de la cuenta:</strong> debe coincidir con donde está la mayoría de la población del mercado (importa el GMT, no la ciudad). EE.UU.: tipo Los Ángeles. <strong>Australia: por investigar</strong> (elegir la franja que cubra más población; preguntar a Claude/ChatGPT sin tomar la primera respuesta a ciegas). Se fija al crear la cuenta y es irreversible. <em>(Aug 16.)</em></li>
</ul>
<h2 id="mentoria--22-arbitraje-estacional-la-jugada-de-adam-australia">22. Arbitraje estacional — la jugada de Adam (Australia)</h2>
<ul>
<li><strong>Estrategia (arbitraje de hemisferio):</strong> mover el producto de verano europeo a <strong>Australia</strong> (hemisferio sur, estaciones invertidas → arranca primavera/verano). Ger sacó su primera tienda ganadora exactamente así ("rotar el globo terráqueo"). <em>(Aug 16.)</em></li>
<li><strong>Cómo entrar:</strong> nichado pero no cerrado del todo el día uno (testear un poco general para ver cómo reacciona el píxel); si en 1-2 semanas no reacciona → abrir el abanico. Relanzar el producto de verano europeo <strong>empezando en mayo</strong> el año que viene. <em>(Aug 16.)</em></li>
<li><strong>Principio de estacionalidad:</strong> la tendencia cambiará sí o sí; <strong>entender la ventana y transicionar antes que nadie</strong> (como Zara/El Corte Inglés adelantando temporadas) para pillar baja competencia. <em>(Aug 16.)</em></li>
<li><em>(Detalle operativo AU en el doc de socios: traducir la tienda al inglés dentro del mismo Shopify, ABO solo-imágenes, ref. Baby Boo, proveedora Amber.)</em></li>
</ul>
<h2 id="mentoria--23-q4-infraestructura-llc-pagos-y-fiscalidad">23. Q4: infraestructura, LLC, pagos y fiscalidad</h2>
<p><strong>Q4 = maratón, no sprint.</strong> No perseguir facturar todo en 30 días; la ventana de demanda va de <strong>septiembre a enero</strong> (vuelta al cole/trabajo, Halloween, pagas extra, Black Friday, Navidad). <strong>Objetivo de cashflow/profit, no de facturación bruta:</strong> <em>"Prefiero facturar 70.000 € al 25% que 100.000 € al 10-13%."</em> Predicción: septiembre arranca progresivo, boom a finales de mes. <em>(Aug 26 · Aug 19.)</em></p>
<p><strong>Checklist Q4 (repetido varias llamadas):</strong></p>
<ul>
<li><strong>LLC:</strong> pedirla YA (tarda ~14 días reales, a veces mucho más). Preferible <strong>tienda nueva con LLC</strong> que reutilizar una personal antigua (más confianza para Shopify/bancos). Documento preferido internacionalmente: <strong>pasaporte</strong> &gt; DNI. <em>(Aug 9 · Aug 26.)</em></li>
<li><strong>Bancos y tarjetas — redundancia:</strong> múltiples cuentas con la misma LLC (Mercury, Slash, Wise…) y <strong>tarjetas separadas por función</strong> (una Meta Ads, otra Shopify, otra suscripciones), para que un bloqueo no paralice todo. <em>(Aug 9.)</em></li>
<li><strong>Cuentas Meta:</strong> calentamiento gradual (login → esperar → Meta Ads → esperar → portfolio); 2FA; mínimo <strong>2 personas con acceso al BM</strong>; cuentas de respaldo ya calentadas. <em>(Aug 9.)</em></li>
<li><strong>Divisa en USD:</strong> Shopify paga siempre en USD; configurar todo en USD (Meta incluido) para que entradas/salidas cuadren y solo se convierta al calcular el ROAS. <em>(Aug 5.)</em></li>
</ul>
<p><strong>Pagos de Shopify y financiación:</strong></p>
<ul>
<li><strong>Acelerar Shopify Payments:</strong> contactar soporte alegando tiempos de entrega correctos + tracking. Shopify retiene más si el tránsito medio es largo (+20 días) → entregar rápido libera antes. La transición personal → LLC suele ser especialmente lenta (<strong>confirmado por Adam</strong>: "a mí me tardaron tela en soltar"). <em>(Aug 26.)</em></li>
<li><strong>WAP:</strong> procesador alternativo/complemento; su tarjeta permite pagar Meta con lo facturado (autofinanciación), aunque las transferencias son más lentas. Tenerlo activo como respaldo para migrar rápido si Shopify holdea. <em>(Aug 26.)</em></li>
<li><strong>Wop:</strong> financiación de cash-flow (pagan la facturación cada 2 días, dan tarjeta para gastar en Meta antes de cobrar — "cash flow infinito"). Requisito flexibilizado a ~50k € de facturación (antes muy estricto), tránsito &lt;14 días, contracargos &lt;1%. Ger tiene contacto directo y <strong>condicionó meter a Adam</strong> a que mantuviera el momentum de junio. <em>(Jun 23 · 1-1 · Aug 9.)</em></li>
</ul>
<p><strong>Fiscalidad internacional / residencia (para cuando tenga sentido):</strong></p>
<ul>
<li><strong>Regla de los 183 días:</strong> fuera de España &gt;183 días/año (pueden ser dispersos) y sin "sustancia económica" en España (casa, hijos escolarizados, bancos/teléfono españoles). <em>(Aug 26.)</em></li>
<li><strong>Georgia</strong> (1% sobre facturación de origen extranjero, empresa desde ~1.500-2.000 €, bancos en 24h — buen "país de transición"); <strong>Dubái</strong> (0% hasta ~medio millón de dirhams, luego 7-9%; Ger reside allí); <strong>Paraguay</strong> (residencia rápida pero "no tan fuerte"); Malta/Chipre/Portugal/Andorra a investigar. <strong>CRS:</strong> fuera de la UE no hay intercambio automático de info; la UE es especialmente agresiva. <em>(Aug 26.)</em></li>
</ul>
<hr />
<h1 id="mentoria--e-operacion-tienda-marca-y-herramientas">E. Operación, tienda, marca y herramientas</h1>
<h2 id="mentoria--24-branding-y-experiencia-de-tienda">24. Branding y experiencia de tienda</h2>
<ul>
<li><strong>Ennicharse al 100%:</strong> eliminar todo lo que no sea del nicho (a Adam: fuera productos de hombre y vestidos "de relleno"; solo tacones + sandalias). <em>(Jun 23 · 1-1.)</em></li>
<li><strong>Banner principal — dos estrategias válidas según público:</strong> (1) <strong>avatar + producto winner</strong> → público joven (20-50), impulsivo, identificación rápida; (2) <strong>storytelling "founder history"</strong> (pareja/fundadores con IA) → público 50-60+, más lectura, bueno para liquidaciones. <strong>Congruencia obligatoria:</strong> mismo avatar/rango de edad en toda la tienda (como Zara). <em>(Aug 9 · Jun 23.)</em></li>
<li><strong>Reseñas:</strong> usarlas para <strong>rebatir objeciones concretas</strong> (ej. tiempos de envío), no reseñas genéricas tipo "me encanta". Ger las prefiere sin foto (estética limpia), aunque con foto también funciona. Referencia: la tienda "la Vechic". <em>(Aug 9 · Jun 23.)</em></li>
<li><strong>Imágenes IA hiperrealistas y coherentes con el mercado</strong> (fondo mediterráneo para ES/Grecia, casco antiguo para Francia; para tacones: pies cruzados, fondo de madera, pedicura cuidada, paseo marítimo). Freepik además de Higgsfield. Catálogos curados (50-100 productos) mejor que "tienda de 1.000 productos genérica". <em>(Jun 23 · Aug 9.)</em></li>
<li><strong>Packaging:</strong> el packaging bonito <strong>no genera diferencia real</strong>; lo que importa es una <strong>tarjeta de visita</strong> dentro y el <strong>envío neutral</strong> (sin marcas chinas) bajo petición. Cajas brandeadas solo con volumen alto. <em>(Aug 19 · Jun 23.)</em></li>
</ul>
<h2 id="mentoria--25-ux-cro-cambios-concretos-de-la-1-1">25. UX / CRO — cambios concretos (de la 1-1)</h2>
<ul>
<li><strong>Quitar el zoom/lupa</strong> en las páginas de producto ("esto es malo"). <em>(Jun 23 · 1-1.)</em></li>
<li><strong>Pop-up de descuento:</strong> no en páginas de colección ni carrito; no mostrarlo si ya hay ATC; mostrarlo tras <strong>60-90 s de inactividad</strong> como "salvavidas" para indecisos (secuencial: email → SMS con 5% extra). <em>(Jun 23 · 1-1.)</em></li>
<li><strong>Quitar Klarna</strong> del checkout (se reactiva sola al migrar a LLC) y elementos ambiguos de "pago seguro". <strong>Añadir iconos de pago en la página de carrito.</strong> <em>(Jun 23 · 1-1.)</em></li>
<li><strong>Home:</strong> bestsellers del nicho arriba, fuera categorías ajenas, 1-2 imágenes hero de estilo de vida con IA; sin storytelling largo en home (solo en copies de anuncios). Repetir creativos/textos entre colecciones no es problema (está sobrevalidado). <em>(Jun 23 · 1-1.)</em></li>
</ul>
<h2 id="mentoria--26-precision-en-metricas-error-detectado-en-la-1-1">26. Precisión en métricas (error detectado en la 1-1)</h2>
<ul>
<li>Adam automatizó el ROAS pero <strong>calculaba margen a nivel de producto y no de campaña</strong> → decisiones de escalado mal fundamentadas (sobre todo en colecciones con productos de distinto margen). Ger: <em>"donde está el dinero no es en facturar más, es en que no se te escape lo que ya tienes en la mesa."</em> Automatizar con IA para evitar errores humanos, <strong>pero supervisándolo</strong>. <em>(Jun 23 · 1-1.)</em></li>
</ul>
<h2 id="mentoria--27-se-escala-desde-el-backend-mensaje-central">27. "Se escala desde el BACKEND" (mensaje central)</h2>
<ul>
<li>El <strong>backend</strong> (calidad de producto, tiempos de envío del proveedor, atención al cliente, control de contracargos &lt;1%) importa <strong>más</strong> que el frontend para escalar de forma sostenible. El frontend es "fácil" (subir presupuesto duplica facturación), pero sin backend "el castillo de arena se va a la mierda". Ejemplo: Joaquín y Sofía facturaron 40-50k € sin ver profit. Ger dice haber invertido +50.000 € en formación y que este es el mejor consejo que ha recibido. <em>(Aug 19.)</em></li>
<li><strong>Atención al cliente proactiva:</strong> comunicar los retrasos <strong>antes</strong> de que el cliente se queje (flujo tipo "tu pedido está en buenas manos, ha habido un pequeño retraso") — esto permitió a Adam vender el producto que otros no se atrevían a vender por los "3-5 días laborables". Ger lo valida como clave de su éxito. <em>(Jun 23 · 1-1.)</em></li>
</ul>
<h2 id="mentoria--28-herramientas-de-ia-y-equipo">28. Herramientas de IA y equipo</h2>
<ul>
<li><strong>Reparto de herramientas:</strong> <strong>ChatGPT/Manus</strong> para diálogo/estrategia/mentalidad (Manus gratis por tiempo limitado); <strong>Claude</strong> para código, desarrollo, lectura de métricas/análisis técnico (pero "pesado" para charlar). Ger usa <strong>Claude Code + extensión de Chrome</strong> para rellenar formularios, importar colecciones y leer la pestaña en tiempo real ("me ha aumentado la productividad una locura"). Consejo: tratar a la IA "como un empleado" al que no dejas cuestionar instrucciones. <em>(Aug 19.)</em></li>
<li><strong>App propia de Ger:</strong> atención al cliente con IA para la Shopify App Store (gestiona reembolsos, cambios de talla, vigila tracking y dispara emails de prevención); en revisión con Shopify. También estudia <strong>ScaleChart</strong> (tablas de tallas automáticas). <em>(Aug 19 · Aug 26.)</em></li>
<li><strong>Tema de tienda:</strong> Ger prepara un tema genérico (basado en el suyo) para regalar antes de septiembre; alternativas: desarrollador (~100-200 USD) o hacerlo con <strong>Claude Code</strong> conectado a Shopify. <em>(Aug 9.)</em></li>
<li><strong>Equipo:</strong> editor de vídeo/creativo ("filmino") a 3-3,5 USD/h para sostener el volumen de creativos. <em>(Mayo 2025.)</em></li>
<li><strong>Instagram de marca:</strong> activo a largo plazo que aumenta la confianza social y reduce el CPC efectivo. <em>(Mayo 2025.)</em></li>
<li><strong>Seguridad / phishing:</strong> cuidado con correos de "colaboración" y suplantaciones (dominios casi idénticos, M→RN); nunca dar contraseñas por email/chat, verificar remitente letra a letra. <em>(Aug 9.)</em></li>
</ul>
<hr />
<h1 id="mentoria--f-mindset-y-principios-transversales">F. Mindset y principios transversales</h1>
<p>Núcleo de la formación ("Vision"):</p>
<ul>
<li><strong>Decisiones por datos, no por emociones.</strong> Nunca tomes una gran decisión enfadado o en un día malo. <em>(Aug 16.)</em></li>
<li><strong>El mercado es el mejor mentor.</strong> Ger no da recetas; tu validación manda. <strong>El objetivo real no son las ventas, es desarrollar el sistema/la habilidad de leer el mercado</strong> — replicable y que nadie te quita. <em>(Aug 16.)</em></li>
<li><strong>Baja barrera de entrada = la ventaja es la visión.</strong> Gana quien ve la oportunidad antes y mejor. <em>(Aug 16.)</em></li>
<li><strong>Equivocarse rápido:</strong> <em>"cuanto antes os equivoquéis, más rápido arregláis, y llegáis antes al resultado."</em> La duda no se evita, se abraza. <em>(Aug 5.)</em></li>
<li><strong>Resiliencia ante bans/pérdidas (caso Dani):</strong> <em>"siempre hay algo peor... me monto otra cuenta, pero tengo la habilidad."</em> Ger perdió una vez todo Facebook con 300k € dentro. <em>"Nadie llega a la cima mientras escala: la roca te hace sangre en las manos, si no, no te salen los callos."</em> No depender de un único activo/cuenta → <strong>redundancia siempre</strong>. <em>(Aug 5 · Aug 26.)</em></li>
<li><strong>Regla del "por 10" (Grant Cardone):</strong> fijar metas 10x y ejecutar 10x más acción; aunque no llegues, llegas mucho más lejos. Sin creencias limitantes sobre cifras. <em>(Aug 26.)</em></li>
<li><strong>Tener un "porqué" claro</strong> (familia, libertad) — lo único que sostiene la disciplina en rachas buenas (evitar relajarse tras el primer éxito) y malas. <em>(Aug 26.)</em></li>
<li><strong>Paciencia y constancia:</strong> un producto no pasa de 50 € a 1.000 € en un día; se descubre "a pico y pala". Los problemas son bendiciones: analízalos y previénlos. No compararse con el resto. <em>(Aug 16.)</em></li>
<li><strong>Contexto Q4:</strong> arranca en septiembre — prepararse con calma pero al máximo. <em>(Aug 16 · Aug 26.)</em></li>
</ul>

<h2 id="socios--1-estrategia-de-testeo-abo-no-cbo-metodologia-de-los-mentore">1. ⭐ Estrategia de testeo ABO, no CBO (metodología de los mentores de Gonzalo)</h2>
<p>Este es el aprendizaje central y el que más se aparta de lo que veníamos trabajando. La escuela de Gonzalo <strong>testea siempre en ABO</strong> (presupuesto fijo por conjunto de anuncios), y solo <strong>cuando algo ya está validado lo lleva a una ACBO/CBO</strong> para escalar.</p>
<p><strong>El flujo completo:</strong></p>
<ol>
<li><strong>Testeo en ABO, siempre.</strong> Presupuesto fijo a nivel de conjunto de anuncios, no de campaña. Lo mantienen "todo el rato" con ABO.</li>
<li><strong>Conjuntos separados por formato/variante.</strong> Ejemplo real (Aug 17 · larga): vestido con 3 variantes de color → <strong>3 conjuntos de anuncios (uno por color), 25 € por conjunto</strong>, ~3-4 creativos por conjunto (mezcla imagen/vídeo; público joven → más imágenes, público mayor → más vídeo).</li>
<li><strong>Pocos anuncios por conjunto:</strong> máximo <strong>3 anuncios</strong>, mejor menos. Todo analizado, sin saturar.</li>
<li><strong>No tocar cada día.</strong> Dejar correr <strong>~5-7 días</strong> y quedarte con lo que funciona.</li>
<li><strong>Graduación de winners a CBO/ACBO:</strong> validado (unos días de buen ROAS), sacas los ganadores a una <strong>CBO</strong> y la escalas fuerte. Ej.: si funcionan 2 imágenes y 1 vídeo, montas una CBO con esas 2 imágenes + 1 vídeo.</li>
<li><strong>La CBO no se testea dentro.</strong> Todo lo que entra ya está filtrado desde la ABO. Los creativos nuevos se iteran <strong>fuera</strong> del conjunto ganador (conjuntos nuevos), para medir el creativo en frío.</li>
<li><strong>Ciclo continuo:</strong> nuevos ABO para testear; lo que no funciona se descarta, lo que funciona sube a la CBO. Testeo y escalado separados por diseño.</li>
</ol>
<p><strong>Cifras de ejemplo mostradas en pantalla (Aug 17 · larga):</strong> un conjunto escalado de 25→50 €/día fue el que más vendió ese día; ROAS 5,36 vs 2,58 (el de 2,58 gastó 88 €, el de 5,36 gastó 53 € con un pedido gordo); un creativo tipo entrevista para público mayor con CTR 4,63 / CPC 0,28; frecuencia 2,19 explicada por el retargeting propio del funnel (vídeo en frío → imagen de refuerzo).</p>
<p><strong>Por qué tiene sentido:</strong> con presupuesto fijo por conjunto controlas cuánto invierte cada formato/creativo y comparas en igualdad; la CBO reparte a su antojo y "esconde" creativos con poco gasto. Separar test (ABO) de escala (CBO) evita que el algoritmo reaprenda cada vez que metes un creativo nuevo en la campaña que ya rinde.</p>
<blockquote>
<p>⚠️ <strong>Contraste con la doctrina de mentoría (Ger):</strong> Ger trabaja el testeo y el escalado <strong>dentro de CBO</strong> (incluido el híbrido de Adam de meter conjuntos con presupuesto fijo <em>dentro</em> de una CBO). Gonzalo hace lo contrario: <strong>ABO para testear puro</strong> y <strong>CBO solo para escalar lo ganador</strong>. En la práctica <strong>convergen</strong> en un punto: Adam aconsejó a Gonzalo para la cuenta nueva de Australia <strong>no usar CBO hasta validar</strong>. Merece la pena <strong>testear ambas</strong> con datos propios. <em>(Nota: Álvaro Nortes, en su masterclass, prefiere lo contrario — </em><em>CBO sobre ABO</em><em> — porque el aprendizaje se acumula mejor a nivel campaña. Tres opiniones distintas → decisión con data propia.)</em></p>
</blockquote>
<p><em>(Llamadas Aug 17.)</em></p>
<hr />
<h2 id="socios--2-segmentacion">2. Segmentación</h2>
<ul>
<li><strong>No filtrar de más al inicio.</strong> Error de Gonzalo: filtrar por edad/criterios estrechos desde el principio. Lección: <strong>no filtrar por nada</strong> al arrancar y dejar que el conjunto abra.</li>
<li><strong>Cuando ya hay validación, sí segmentar con intención.</strong> Ejemplo real de CBO ganadora de Gonzalo: <strong>mujer, 35–40 hasta 65+</strong>. Se estrecha <em>después</em>, con data (coincide con §7: el comprador fuerte en España es de 40–50 para arriba).</li>
</ul>
<blockquote>
<p>Esto <strong>refuerza</strong> la doctrina de mentoría (abierta por defecto; cerrar solo con datos).</p>
</blockquote>
<p><em>(Aug 17.)</em></p>

<h2 id="socios--3-nicho-estrecho-vs-tienda-de-moda-amplia-enfocada-aug-17-la">3. Nicho estrecho vs. tienda de moda amplia enfocada (Aug 17 · larga)</h2>
<p>Desacuerdo explícito y jugoso, útil para tener presente el enfoque alternativo:</p>
<ul>
<li><strong>Gonzalo</strong> defiende <strong>nichar al máximo</strong> (una tienda = una categoría, ej. solo vestidos), apoyándose en "gente premium de ecommerce": <em>"no es el producto, es el cliente ideal que tú tengas"</em>. Cree que mezclar categorías (vestidos + chaquetas) en el mismo píxel puede confundir el comportamiento de compra aunque el público (mujer) sea el mismo.</li>
<li><strong>Adam</strong> responde que el comportamiento de compra <strong>sí difiere por categoría aunque sea el mismo cliente</strong> (<em>"no compro igual de rápido un bañador que una chaqueta, siendo el mismo comprador"</em>) y que eso puede "rayar el píxel"; pero defiende meter <strong>varias categorías relacionadas</strong> para la misma mujer (tacones + vestidos + faldas) porque concentra información en el píxel — distinto de mezclar categorías opuestas (zapatos de hombre + vestidos de mujer).</li>
<li><strong>Conclusión práctica compartida:</strong> empezar nichado (Gonzalo entra en septiembre solo con vestidos de boda) e ir <strong>ampliando por colecciones relacionadas</strong> según la competencia, sin perder foco.</li>
</ul>
<blockquote>
<p>⚠️ <strong>Contraste:</strong> el "mono-categoría muy nichado" de Gonzalo viene de sus propios mentores, no de Ger. El enfoque de Adam (moda con varias categorías relacionadas para la misma mujer) está más alineado con Ger. Tenerlo como enfoque alternativo válido, no descartarlo.</p>
</blockquote>
<hr />
<h2 id="socios--4-expansion-a-australia-arbitraje-estacional-jugada-de-adam">4. Expansión a Australia — arbitraje estacional (jugada de Adam)</h2>
<p>Reafirma y concreta lo del doc de mentoría, con detalle operativo nuevo:</p>
<ul>
<li><strong>Tienda nueva / relanzamiento limpio; pausar la actual.</strong> Adam tuvo que pagar la denuncia de Shopify sobre la tienda vigente; ese recurso solo sirve en <em>esa</em> tienda.</li>
<li><strong>Ventana estacional:</strong> Australia entra en primavera/verano (hemisferio sur) mientras Europa cierra verano. El producto de verano europeo que se quedó a medias se relanza allí para coger la ola completa. Objetivo: <strong>replicar o triplicar lo de Italia</strong> y crear un <strong>"bucle" estacional</strong> (verano Italia/España → temporada Australia ~ene-feb → vuelta a Italia).</li>
<li><strong>(Aug 17 · larga) Ejecución concreta:</strong> <strong>traducir la tienda actual a inglés/AU dentro del mismo Shopify</strong> (no crear una de cero), calentar cuentas de Facebook nuevas, y lanzar en Australia con <strong>ABO solo-imágenes</strong> (en EE.UU./mercados saturados las imágenes rinden más que el vídeo por la saturación de contenido IA).</li>
<li><strong>(Aug 17 · larga) Atrezzo/fondos:</strong> lo que funciona en España (piedra, vegetación local) no sirve en Australia; referencia de estilo a replicar: <strong>Baby Boo</strong> (marca australiana, vestidos ~87-118 $, muy brandeada aunque haya dropshipping de fondo).</li>
<li><strong>(Aug 17 · larga) Sourcing pendiente:</strong> reactivar a <strong>Amber</strong> (proveedora para la tienda de tacones AU).</li>
<li><strong>Entrada nichada pero no cerrada del todo:</strong> un poco más abierta al inicio (vestidos <strong>y</strong> zapatos) para ver cómo reacciona el píxel; luego se cierra. Germán validó entrar <strong>directamente nichado en otro mercado</strong> ("es lo mejor que puedes hacer"), con la advertencia de que es <strong>otro píxel</strong>.</li>
</ul>
<p><em>(Llamadas Aug 17.)</em></p>
<hr />
<h2 id="socios--5-infraestructura-de-cuentas-para-q4-meta-pagos">5. Infraestructura de cuentas para Q4 (Meta + pagos)</h2>
<p>Bloque muy operativo y con urgencia de calendario:</p>
<ul>
<li><strong>Estructura nueva y separada desde cero:</strong> perfil de Facebook nuevo <strong>calentado poco a poco</strong>, portfolio nuevo <strong>verificado con la LLC</strong>, y <strong>cuentas publicitarias de cero</strong>. La antigua estaba "en la mierda" (cuentas en euros, una tumbada).</li>
<li><strong>Cobrar en la divisa local</strong> (USD / AUD / EUR) para <strong>evitar comisiones de cambio</strong>. La <strong>zona horaria de la cuenta no se puede cambiar</strong> después → ponerla bien de entrada.</li>
<li><strong>En paralelo y con tiempo:</strong> el calentamiento es lento (perfil hoy → portfolio en 4–5 días → cuenta más adelante); tener cuentas de sobra como backup si en Q4 te tumban una.</li>
<li><strong>Cuentas a preparar:</strong> <strong>AU en AUD</strong> y <strong>EU en EUR</strong> (nuevas, calentar). La de Italia de Gonzalo ya está medio calentada.</li>
<li><strong>Slash vs Mercury:</strong> <strong>Slash cobra bastantes menos comisiones</strong> que Mercury. Gonzalo ya opera con Slash; Adam lleva mes y medio en revisión (le piden documentación). Interesa migrar cuando aprueben. <em>(Refuerzo cruzado: Nortes también le recomendó Slash a Adam — 2% cashback pagando ads en USD.)</em></li>
<li><strong>(Aug 17 · larga) Recargos de Meta por localización:</strong> Italia ~3%, España ~5% sobre la factura de ads (cada cobro añade ese % extra).</li>
<li><strong>(Aug 17 · larga) Q4 como ventana crítica:</strong> <em>"Ahora mismo, si coges el avión para despegar, no aterriza hasta diciembre. Como se te vaya el avión en la cara, a esperar al siguiente."</em> Prefiere hacer ahora "las cosas aburridas" (backend) para luego meter caña.</li>
</ul>
<p><em>(Llamadas Aug 17.)</em></p>
<hr />
<h2 id="socios--6-precios-y-margenes">6. Precios y márgenes</h2>
<ul>
<li><strong>Suelo de precio alto.</strong> Adam <strong>no baja de 50 €</strong>; en Australia apunta a <strong>≥60 €</strong>. Vende vestidos entre <strong>54,95 € y 60 €</strong>.</li>
<li>Gonzalo: vestidos a <strong>59,99 / 99 €</strong>; margen mínimo <strong>~25-35 €/vestido</strong> tras costes (incluida tasa ~3 € de pasarela); no deja descuentos &gt;50%.</li>
<li><strong>(Aug 17 · larga) Cifras de Adam:</strong> ~<strong>12.000 €</strong> en devoluciones y ~<strong>6.000 €</strong> en impuestos en un periodo; de ~16.000 € brutos le quedaron ~5.000 € netos. Atribuye buena parte de las devoluciones al proveedor "Winnie".</li>
<li><strong>Rechazo explícito al low-ticket:</strong> vender a 30–40 € deja margen de mierda; un día malo con Meta y se va el profit. Conclusión: <strong>subir ticket, no competir por precio</strong>.</li>
<li><strong>Descuentos con cabeza:</strong> ~25-30%, no descuentos artificiales tipo "150€ rebajado de 400€" que no justifica el coste real.</li>
</ul>
<p><em>(Llamadas Aug 17.)</em></p>
<hr />
<h2 id="socios--7-publico-mayor-y-angulo-de-venta-comodidadortopedico">7. Público mayor y ángulo de venta (comodidad/ortopédico)</h2>
<ul>
<li><strong>Quién compra en España:</strong> gente de <strong>40–50 para arriba</strong>. Los jóvenes compran menos y hacen menos carrito adicional.</li>
<li><strong>(Aug 17 · larga)</strong> Adam midió su público de tacones sobre todo en <strong>40-60 años</strong>, con ventas también en joven; el sector hombre (chinos, zapatos) le funcionó bien el año pasado con menos problemas de calidad que en vestidos.</li>
<li><strong>Vender "engrosado" (maximizar carrito):</strong> que el comprador se lleve lo máximo (dos pares de zapato). Nichar la tienda ayuda (referencia al "Montecristo").</li>
<li><strong>Nicho de oro: calzado ortopédico / de comodidad</strong> para mayores. De los mejores nichos.</li>
<li><strong>El ángulo manda, no la estética:</strong> vender <strong>comodidad</strong> (tacones/zapatos para andar mucho o de viaje; vestidos "suelto, no me agobia"), no "mira qué bonito". Adam ya tira ángulos de comodidad y le compran por eso.</li>
<li><strong>(Aug 17 · larga) Dato de producto:</strong> en vestidos para mujeres mayores, <strong>las mangas largas venden más</strong> (ocultan flacidez de brazos) — confirmado por análisis previo con Claude y por histórico de otras marcas.</li>
</ul>
<p><em>(Llamadas Aug 17.)</em></p>
<hr />
<h2 id="socios--8-nicho-vs-moda-creativos-copy-y-ecosistema-aprendizaje-de-g">8. Nicho vs Moda — creativos, copy y ecosistema (aprendizaje de Gonzalo)</h2>
<ul>
<li><strong>El nicho es más fácil de analizar con Claude:</strong> cubre todos los dolores del avatar y saca ángulos al momento; la moda es más "de gusto" y menos sistematizable.</li>
<li><strong>Pero el nicho exige muchos más creativos:</strong> creativo tras creativo atacando persona tras persona hasta ver qué subnichos compran más.</li>
<li><strong>Formato más sencillo:</strong> menos vídeo, más <strong>copies largos</strong> que tocan dolencias → la persona lee, se lo traga, pasa a landing/producto y compra.</li>
<li><strong>Ecosistema multi-fanpage (advertorial/recomendación):</strong> fanpage de marca + fanpages tipo "la doctora que te recomienda esto", todo retroalimentado; distintas cuentas por ángulo. En moda es más complejo. <em>(Conecta directamente con la táctica de "persona ficticia" ToF de Nortes.)</em></li>
<li><strong>Modelo de suscripción / MRR</strong> en nichos de consumible — ingreso recurrente que la moda no da.</li>
</ul>
<p><em>(Aug 17.)</em></p>
<hr />
<h2 id="socios--9-creativos-y-copy-aug-17-larga">9. Creativos y copy (Aug 17 · larga)</h2>
<ul>
<li><strong>Formato por edad:</strong> público mayor (40-60) → <strong>fotos/vídeos con modelo posado, buena calidad, sin UGC</strong> + <strong>copies largos tipo carta/testimonial</strong> contra objeciones ("abres el armario lleno de zapatos, pero ninguno te queda bien..."). Joven → formatos más nativos/rápidos; compra cada vez más en Shein/Temu.</li>
<li><strong>Imágenes &gt; vídeo</strong> ahora mismo en España e incluso EE.UU., por saturación de vídeos IA de baja calidad ("se ha llenado de basura"). España sigue la ola de EE.UU. con retraso.</li>
<li><strong>Copy largo estilo native ad:</strong> Gonzalo apenas toca el copy (descripciones cortas); Adam le insiste en probar copys largos que apelen al dolor/objeción, porque en España casi nadie lo hace → diferencial.</li>
<li>Uso de <strong>Claude/Kling</strong> para generar imágenes de producto brandeadas y motion control.</li>
</ul>
<hr />
<h2 id="socios--10-estructura-de-tienda-ux-en-shopify-aug-17-larga">10. Estructura de tienda / UX en Shopify (Aug 17 · larga)</h2>
<p>Bloque nuevo muy accionable — Adam le pasa a Gonzalo su know-how de conversión:</p>
<ul>
<li><strong>Tema Down</strong> (gratuito) personalizado a fondo con Claude ("le he metido todo lo que estoy haciendo con Claude encima del Down"). Antes usaba Impulse. El tema se puede <strong>transferir</strong> entre tiendas vía soporte de Shopify (con evidencia de cierre de la anterior).</li>
<li><strong>Filas de productos relacionados por etiquetas:</strong> en vez del típico "otros clientes vieron esto", Adam monta <strong>etiquetas por atributo</strong> (largo, estampado, tipo de cuello, color, marca/tipo de calzado) que generan filas de relacionados <strong>realmente relevantes</strong> en la página de producto → más conversión y AOV. Recomendado a Gonzalo para sus vestidos (etiquetar por largo, estampado, ocasión).</li>
<li><strong>Guía de tallas basada en modelo:</strong> cada modelo de foto tiene nombre (ej. "Pepa") y medidas asociadas; la ficha aparece siempre que sale esa modelo.</li>
<li><strong>Quitar la lupa/zoom de producto:</strong> puede jugar en contra (la gente se "pierde" en la lupa y no vuelve a comprar) y las fotos no siempre aguantan el zoom.</li>
<li><strong>Homepage con colecciones destacadas</strong> (vestidos de boda / de septiembre / lisos) en vez de solo "otros clientes vieron esto"; priorizar la categoría que más tráfico trae y corregir el scroll de escritorio (el carrusel roba el scroll del ratón).</li>
</ul>
<hr />
<h2 id="socios--11-investigacion-por-producto-e-ingenieria-inversa">11. Investigación por producto e ingeniería inversa</h2>
<p>Ambos han pasado de <strong>analizar tiendas</strong> a <strong>buscar por producto</strong> (partiendo del catálogo del proveedor y de lo que ven escalar).</p>
<p><strong>Caso Pauliti.lab (llamada corta):</strong> colágeno que quita los picores a los perros (suplementación mascotas). Venden caro, con suscripción (MRR), targetean muchos países, varias cuentas publicitarias. Rastreo: partió de reconocer el <strong>formato de imagen</strong> de la formación (Lorenza Club, hoy cerrada); con la tienda nueva eliminada, pidió a Claude buscar <strong>tiendas de suplementación de los últimos ~6 meses, creadas en EE.UU. vendiendo en España</strong>, y fue tienda por tienda filtrando por ubicación de la LLC (Albuquerque) hasta confirmarla. <strong>Aprendizaje:</strong> quien cierra una tienda suele reabrir con el mismo producto → se reencuentra cruzando producto + geo (LLC EE.UU.) + fecha de creación + biblioteca de anuncios, y <strong>Claude acelera</strong> ese cribado.</p>
<p><strong>(Aug 17 · larga) Filtros que usan en TrendTrack / Winning Hunter:</strong></p>
<ul>
<li><strong>Nicho</strong> (fashion, woman…) sin acotar de más arriba.</li>
<li><strong>Temas de Shopify:</strong> la mayoría de tiendas que facturan fuerte usan <strong>Down, Impulse y Horizon</strong> — dato confirmado por su entorno.</li>
<li><strong>Pasarela WAP</strong> como filtro/proxy de "están facturando".</li>
<li><strong>Visitor country / traffic growth</strong> para ver si una tienda escala y en qué país (útil para AU/EE.UU.).</li>
<li><strong>Búsqueda por imagen de producto:</strong> subir foto propia y sacar tiendas que venden algo similar.</li>
<li>Uso combinado con Claude: de 10-20 tiendas encontradas, solo 2-3 suelen servir.</li>
<li>Ejemplos analizados: tienda china de sartenes ("un pedazo cabrón"), Livia Roma (probablemente cerrada), <strong>Okura</strong> (tienda de EE.UU. con 400 anuncios activos y 28k seguidores que vende también en AU/NZ, anuncios en alemán — inspiración para su proyecto), Noemi Fontaine (le copió casi todos los productos, sin apenas ads activos).</li>
</ul>
<p><em>(Llamadas Aug 17.)</em></p>
<hr />
<h2 id="socios--12-fuentes-de-producto-y-de-competencia">12. Fuentes de producto y de competencia</h2>
<ul>
<li><strong>Catálogo del proveedor (el "mutual", vía Germán):</strong> "una pasada". Product catalog con precios de envío; lo que "se sale" ahí es porque <strong>se vende fuerte</strong>. Winners de <strong>30 $, 50 $, 100 $</strong>. Se puede trabajar directo sin analizar tiendas. (Coincide con §8 del doc de mentoría y con el proveedor nuevo "MD" que Ger presentó en agosto.)</li>
<li><strong>Excel de ~600 tiendas</strong> de Adam (guarda tienda <strong>y</strong> biblioteca de anuncios, porque muchas veces la tienda cierra pero la biblioteca queda). Mantenimiento: ir eliminando nichos cerrados. → <em>Action item: compartirlo con Gonzalo.</em></li>
<li><strong>(Aug 17 · larga) Otro proveedor probado ("Winnie"):</strong> mucha guerra en devoluciones/calidad → Adam no vuelve (aunque quedó bien "por si acaso").</li>
<li><strong>Realidad del juego:</strong> hay gente copiando tiendas enteras; muchos lo prueban, no les va y se desinflan. Al público mayor "le vendes cualquier cosa".</li>
</ul>
<p><em>(Llamadas Aug 17.)</em></p>
<hr />
<h2 id="socios--13-herramientas-y-automatizacion-con-ia">13. Herramientas y automatización con IA</h2>
<ul>
<li><strong>(Aug 17 · larga) Cómo usa Adam Claude:</strong> un proyecto por área — (1) facturas de proveedor + ROAS + calendario de pagos; (2) creativos + ICP; (3) búsqueda de producto/mercado; (4) copywriting (biblioteca de libros de copy como contexto); (5) Shopify/coding. Quiere que los proyectos se "nutran" entre sí (aún sin resolver). Gonzalo igual, con PDFs de contexto por proyecto.</li>
<li><strong>Meta MCP (lo de Gonzalo):</strong> con la integración oficial, <strong>Claude le crea las campañas</strong> directamente (imágenes; vídeo aún no). Clave: dejarle todo el contexto bien definido ("no filtres por nada"). → <em>Adam aún no lo tiene; a valorar.</em></li>
<li><strong>Klaviyo — control de coste:</strong> llegó a ~100 € y subiendo. Montar flujo para eliminar/gestionar perfiles que no compran. (Adam canceló Klaviyo por eso.)</li>
<li><strong>Fathom</strong> para grabar/transcribir llamadas → contexto para Claude (el método que originó estos documentos).</li>
<li><strong>Creación de vídeo IA:</strong> interés en Higgsfield / Seedance 2.5 (Soul) para UGC y "corto Nike"; por probar a fondo.</li>
<li><strong>(Aug 17 · larga) Queja compartida:</strong> Claude "capa" cada vez más (le frenó el sistema de reseñas — ver §14 — y no le ayudó a "hacer trampa" en un examen). "Antes pedías lo que quisieras."</li>
</ul>
<p><em>(Llamadas Aug 17.)</em></p>
<hr />
<h2 id="socios--14-resenas-practica-antigua-frenada-por-claude-aug-17-larga">14. Reseñas — práctica antigua frenada por Claude (Aug 17 · larga)</h2>
<ul>
<li>Adam tenía un sistema para generar reseñas con Claude a partir de <strong>objeciones reales extraídas de tiendas con reseñas auténticas</strong> (asignar estrellas/reseñas por producto). Claude dejó de ayudarle por considerarlo <strong>potencialmente ilegal</strong> (riesgo según el país de venta). Ha conseguido un manual para hacerlo manualmente e intenta "otro proyecto" para sortearlo.</li>
<li>Sospechan que el mecanismo se popularizó vía otro miembro de la comunidad ("Maco").</li>
</ul>
<blockquote>
<p><em>Nota de criterio: generar reseñas ficticias es una práctica de riesgo legal (competencia desleal / protección al consumidor) en la UE. Está bien tenerlo documentado como contexto, pero conviene valorar el riesgo real antes de reactivarlo.</em></p>
</blockquote>
<hr />
<h2 id="socios--15-mentoria-propia-de-gonzalo-decision-de-posponer-aug-17-la">15. Mentoría propia de Gonzalo — decisión de posponer (Aug 17 · larga)</h2>
<ul>
<li>Gonzalo baraja lanzar mentoría de pago: <strong>1.000 € a un grupo de 5 personas</strong>, o formar gratis a 2-3 amigos.</li>
<li><strong>Adam le recomienda posponerlo</strong> y escalar primero sus tiendas para Q4: el retorno de esas horas es mayor en las tiendas; formar gente consume "el doble de lo que crees" y añade presión emocional con amigos.</li>
<li><strong>Punto intermedio acordado:</strong> Gonzalo empieza formando informalmente a <strong>2 colegas</strong> (uno con el curso de "Uru" como base + llamadas semanales), sin comprometerse a mentoría de pago, para ganar casos de éxito antes de monetizar.</li>
<li>Filosofía preferida a futuro: no "vender" la mentoría, sino ser referente y que la gente venga (modelo "Conde de Montecristo", bajo perfil), frente a mentores que exponen todo su día a día.</li>
